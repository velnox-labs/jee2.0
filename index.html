/* ---------- Auto-fit text ----------
   Any text that spills out of its box (tile, card, button, chip, popup...) gets a smaller font
   until it fits. It is re-measured whenever the page content changes or the window is resized,
   so text goes back to full size when there is room again. Add data-nofit to an element to skip it. */
const FIT = {roots:new Set(), tm:null, rtm:null};
function fitHasOwnText(el){
  for(const n of el.childNodes) if(n.nodeType===3 && n.nodeValue.trim()) return true;
  return false;
}
function fitTextRect(el){
  let l=Infinity, t=Infinity, r=-Infinity, b=-Infinity;
  const rg = document.createRange();
  for(const n of el.childNodes){
    if(n.nodeType!==3 || !n.nodeValue.trim()) continue;
    rg.selectNodeContents(n);
    for(const q of rg.getClientRects()){
      if(!q.width && !q.height) continue;
      l=Math.min(l,q.left); t=Math.min(t,q.top); r=Math.max(r,q.right); b=Math.max(b,q.bottom);
    }
  }
  return l===Infinity ? null : {left:l, top:t, right:r, bottom:b};
}
function fitOverflows(el){
  const rect = el.getBoundingClientRect();
  if(rect.width<4 || rect.height<4) return false;          // hidden or a 1px helper
  const tr = fitTextRect(el);
  if(!tr) return false;
  const cs = getComputedStyle(el);
  // 1) text running out of its own element (single-line, ellipsis or clipped text)
  if(cs.display!=='inline' && (cs.whiteSpace.startsWith('nowrap') || cs.overflowX!=='visible' || cs.textOverflow==='ellipsis')){
    // clipping and "..." happen at the content edge, so the padding does not count as room
    if(tr.right > rect.right - (parseFloat(cs.borderRightWidth)||0) - (parseFloat(cs.paddingRight)||0) + 1) return true;
  }
  // 2) text running out of the nearest box (something with a background, border or clipping)
  let box = el, bcs = cs;
  while(box){
    if(bcs.overflowX==='auto' || bcs.overflowX==='scroll') return false;     // scrolling strip: text may be off-screen on purpose
    const hasBg = (bcs.backgroundColor!=='rgba(0, 0, 0, 0)' && bcs.backgroundColor!=='transparent') || bcs.backgroundImage!=='none';
    const hasBorder = (parseFloat(bcs.borderLeftWidth)||0)>0 || (parseFloat(bcs.borderRightWidth)||0)>0;
    if(hasBg || hasBorder || bcs.overflowX!=='visible' || box===document.body) break;
    box = box.parentElement; if(box) bcs = getComputedStyle(box);
  }
  if(!box) return false;
  const br = box===document.body || box===document.documentElement
    ? {left:0, top:-Infinity, right:document.documentElement.clientWidth, bottom:Infinity}
    : box.getBoundingClientRect();
  const padR = (parseFloat(bcs.paddingRight)||0)*0.5, padL = (parseFloat(bcs.paddingLeft)||0)*0.5;
  const bR = br.right - (parseFloat(bcs.borderRightWidth)||0) - padR;
  const bL = br.left + (parseFloat(bcs.borderLeftWidth)||0) + padL;
  if(tr.right > bR + 1 || tr.left < bL - 1) return true;
  if(box!==document.body && tr.bottom > br.bottom - (parseFloat(bcs.borderBottomWidth)||0) + 1) return true;
  return false;
}
/* Puts back whatever inline font-size the element had before we shrank it. */
function fitReset(el){
  if(!el.hasAttribute('data-fit') && !el.hasAttribute('data-fit-o')) return;
  const o = el.getAttribute('data-fit-o');
  if(o) el.style.setProperty('font-size', o); else el.style.removeProperty('font-size');
  el.removeAttribute('data-fit'); el.removeAttribute('data-fit-o');
}
function fitOne(el){
  if(!fitOverflows(el)) return;
  const orig = parseFloat(getComputedStyle(el).fontSize);
  const min = Math.max(8, orig*0.55);
  el.setAttribute('data-fit-o', el.style.getPropertyValue('font-size'));
  let size = orig;
  while(size>min && fitOverflows(el)){
    size = Math.max(min, size - Math.max(0.5, size*0.04));
    el.style.setProperty('font-size', size.toFixed(1)+'px', 'important');
  }
  if(fitOverflows(el)) fitReset(el);          // shrinking would not help: leave it as designed
  else el.setAttribute('data-fit','1');
}
function fitScan(root){
  if(!root || !root.isConnected) return;
  root.querySelectorAll('[data-fit]').forEach(fitReset);
  fitReset(root);
  const found = new Set();
  const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
  for(let n=tw.nextNode(); n; n=tw.nextNode()){
    if(!n.nodeValue.trim()) continue;
    const p = n.parentElement;
    if(!p || found.has(p)) continue;
    if(p.closest('svg,pre,textarea,select,option,script,style,[data-nofit]')) continue;
    found.add(p);
  }
  found.forEach(fitOne);
}
function fitRun(){
  FIT.tm = null;
  const roots = [...FIT.roots].filter(r=>r.isConnected); FIT.roots.clear();
  const top = roots.filter(r=>!roots.some(o=>o!==r && o.contains(r)));   // skip roots inside other roots
  top.forEach(fitScan);
}
function fitQueue(root){
  if(root) FIT.roots.add(root);
  if(!FIT.tm) FIT.tm = setTimeout(fitRun, 60);
}
function initAutoFit(){
  if(initAutoFit.done || !document.body) return;
  initAutoFit.done = true;
  new MutationObserver(ms=>{
    for(const m of ms){
      if(m.type==='characterData'){ if(m.target.parentElement) fitQueue(m.target.parentElement); }
      else if(m.target.nodeType===1) fitQueue(m.target);
    }
  }).observe(document.body, {childList:true, subtree:true, characterData:true, attributes:true, attributeFilter:['class','hidden']});
  const all = ()=>{ clearTimeout(FIT.rtm); FIT.rtm = setTimeout(()=>fitQueue(document.body), 150); };
  window.addEventListener('resize', all);
  window.addEventListener('orientationchange', all);
  if(document.fonts){ document.fonts.ready.then(all); document.fonts.addEventListener && document.fonts.addEventListener('loadingdone', all); }
  fitQueue(document.body);
}

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  const lines = [];
  words.forEach(w=>{
    const test = line + w + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line.trim());
      line = w + ' ';
    } else line = test;
  });
  lines.push(line.trim());
  const startY = y - (lines.length-1)*lineHeight;
  lines.forEach((l,i)=>ctx.fillText(l, x, startY+i*lineHeight));
}

function countdownParts(dateStr){
  const days = daysUntil(dateStr);
  return days;

function readinessScore(){
  const components = [];
  components.push({key:'syllabus', weight:35, value:overallSyllabusPct()});

  let activeDays=0;
  for(let i=0;i<14;i++){ if(studyHoursOn(addDays(todayStr(),-i))>0) activeDays++; }
  components.push({key:'consistency', weight:25, value:pct(activeDays,14)});

  const avgPct = recentPercentileAvg(5);
  if(avgPct!=null) components.push({key:'mocks', weight:25, value:Math.min(100,avgPct)});

  const plan = DATA.settings.goal ? buildDailyPlan() : null;
  if(plan && !plan.expired && plan.pace!=null && plan.perWeekNeeded>0){
    components.push({key:'pace', weight:15, value:Math.min(100, (plan.pace/plan.perWeekNeeded)*100)});
  }

  const totalWeight = components.reduce((s,c)=>s+c.weight,0);
  const score = totalWeight>0 ? Math.round(components.reduce((s,c)=>s+c.value*c.weight,0)/totalWeight) : 0;
  return {score, components};
}

    const dateStr = `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const mins = studyHoursOn(dateStr)*60;
    const level = mins<=0 ? 0 : mins<60 ? 1 : mins<120 ? 2 : mins<240 ? 3 : 4;
    const isToday = dateStr===today;
    const isFuture = dateStr>today;
    return `<div class="cal-cell cal-lv${level} ${isToday?'cal-today':''} ${isFuture?'cal-future':''}" data-date="${dateStr}">
      <div class="cal-daynum">${d}</div>
    </div>`;
  }).join('');

  return `
  <div class="cal-header">
    <button class="icon-btn" id="calPrev">${ICONS.chevronLeft||'‹'}</button>

  </div>
  `;
}

const KIND_TO_COLLECTION = {timeBlock:'timeBlocks', task:'tasks', chapter:'chapters', practice:'practiceSessions', test:'tests', revision:'revisions', studySession:'studySessions'};
function performDelete(kind, id){
  if(kind==='revision') DATA.timeBlocks=(DATA.timeBlocks||[]).filter(b=>!(b.link&&b.link.type==='revision'&&b.link.id===id));
  const collection = KIND_TO_COLLECTION[kind];
  const result = collection ? deleteData(collection, id) : null;
  closeModal();
  renderAll();
  if(result && result.item){
    toast('Deleted', {label:'Undo', onClick:()=>{
      updateData(d=>{ d[collection].splice(Math.min(result.idx, d[collection].length), 0, result.item); });

      toast('Restored');
    }});
  } else {
    toast('Deleted');
  }
}

function scheduleRevisionsForChapter(chapterId){
  const exists = DATA.revisions.some(r=>r.chapterId===chapterId);
  if(exists) return;
  const gaps = (DATA.settings.revisionIntervals && DATA.settings.revisionIntervals.length) ? DATA.settings.revisionIntervals : [1,3,7,15];
  gaps.forEach((gap,i)=>{
    DATA.revisions.push({
      id: uid(), chapterId, round: i+1,
      dueDate: addDays(todayStr(), gap),
      completed:false, completedDate:null
    });
  });
}

function chapterPracticeStats(c){
  const sessions = DATA.practiceSessions.filter(p=>p.subject===c.subject && p.chapter===c.name);
  const attempted = sessions.reduce((s,p)=>s+Number(p.attempted||0),0);
  const correct = sessions.reduce((s,p)=>s+Number(p.correct||0),0);
  const wrong = sessions.reduce((s,p)=>s+Number(p.wrong||0),0);
  const accuracy = (correct+wrong) ? pct(correct, correct+wrong) : 0;
  return {attempted, correct, wrong, accuracy, sessionCount: sessions.length};
}
function chapterStudyMinutes(c){
  return allStudy().filter(s=>s.subject===c.subject && s.chapter===c.name).reduce((s,x)=>s+Number(x.minutes||0),0);
}
const WEIGHTAGE_COLORS = {
  High: 'color:var(--red); background:var(--red-tint);',
  Medium: 'color:var(--amber); background:var(--amber-tint);',
  Low: 'color:var(--green); background:var(--green-tint);',
};
function chapterLastStudiedDate(c){
  let last = null;
  allStudy().forEach(s=>{ if(s.subject===c.subject && s.chapter===c.name && (!last || s.date>last)) last = s.date; });
  DATA.practiceSessions.forEach(p=>{ if(p.subject===c.subject && p.chapter===c.name && (!last || p.date>last)) last = p.date; });
  return last;
}
function relativeDayLabel(dateStr){
  const diff = daysBetween(dateStr, todayStr());
  if(diff<=0) return 'today';
  if(diff===1) return 'yesterday';
  if(diff<=6) return diff+' days ago';
  return fmtDateShort(dateStr);
}
function chapterAvgTimePerQuestion(c){
  const sessions = DATA.practiceSessions.filter(p=>p.subject===c.subject && p.chapter===c.name && Number(p.timeMinutes)>0 && Number(p.attempted)>0);
  const totalSec = sessions.reduce((s,p)=>s+Number(p.timeMinutes)*60,0);
  const totalQ = sessions.reduce((s,p)=>s+Number(p.attempted),0);
  if(totalQ<=0) return null;
  return Math.round(totalSec/totalQ);
}
function chapterProgressPct(c){
  const done = [c.notesDone, c.questionsDone, c.pyqsDone, (c.status==='Completed'||c.status==='Revised')].filter(Boolean).length;
  return Math.round(done/4*100);
}
function chapterRowHtml(c){
  const pctV = chapterProgressPct(c);
  const isRev = c.status==='Revised', isDone = c.status==='Completed';
  const SV = 'viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"';
  const badge = isRev
    ? `<div class="ch-badge rev" title="Revised"><svg ${SV}><path d="M1.5 12.5l4.5 4.5L15 7"/><path d="M11 15.5l1.5 1.5L22 7"/></svg></div>`
    : isDone
      ? `<div class="ch-badge done" title="Completed"><svg ${SV}><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>`
      : '';
  return `
  <div class="ch-tile-wrap" data-id="${c.id}">
    ${badge}
    <div class="ch-tile ${c.important?'gold':''} ${pctV===100?'full':''}" style="--p:${pctV}" role="button" tabindex="0">
      <div class="ch-tile-in"><span>${esc(c.name)}</span></div>
    </div>
    <div class="ch-pct ${isRev?'rev':isDone?'done':''}">${pctV}%${isRev?' · Revised':isDone?' · Completed':''}</div>
  </div>`;
}
function chapterDeadlineNote(c){
  if(!c.completeByDate || c.status==='Completed' || c.status==='Revised') return '';
  const t = todayStr();
  if(c.completeByDate < t) return `<span style="color:var(--red); font-size:12px; font-weight:700;">Overdue</span>`;
  const d = daysBetween(t, c.completeByDate);
  return `<span class="muted" style="font-size:12px;">${d===0?'Due today':d+'d left'}</span>`;
}
function bindChapterRowEvents(){

  });
}
function setChapterField(id, field, val){
  let toastMsg = '';
  updateData(d=>{
    const ch = d.chapters.find(c=>c.id===id);
    if(!ch) return;
    ch[field] = val;
    let newStatus = (field==='status') ? val : null;

    // auto status from the Notes / Questions / PYQs ticks
    if(field==='notesDone' || field==='questionsDone' || field==='pyqsDone'){
      const all = !!(ch.notesDone && ch.questionsDone && ch.pyqsDone);
      const any = !!(ch.notesDone || ch.questionsDone || ch.pyqsDone);
      if(ch.status!=='Revised'){
        if(all) newStatus = 'Completed';
        else if(any && ch.status==='Not Started') newStatus = 'Studying';
        else if(!all && ch.status==='Completed') newStatus = 'Studying';
      }
      if(newStatus && newStatus!==ch.status) toastMsg = 'Status: ' + newStatus;
    }

    if(newStatus){
      ch.status = newStatus;
      if(newStatus==='Completed'||newStatus==='Revised'){
        if(!ch.completedOn) ch.completedOn = todayStr();   // used to measure your pace
        scheduleRevisionsForChapter(id);
      } else {
        ch.completedOn = null;
      }
    }
  });
  renderAll();
  openChapterDetail(id);
  if(field==='status') toast('Chapter status updated');
  else if(toastMsg) toast(toastMsg);
}

function saveNewChapter(){

let PRACTICE_FILTER = { subject:'' };

function avgTimePerQuestion(subject){
  const sessions = DATA.practiceSessions.filter(p=>Number(p.timeMinutes)>0 && Number(p.attempted)>0 && (!subject || p.subject===subject));
  const totalSec = sessions.reduce((s,p)=>s+Number(p.timeMinutes)*60,0);
  const totalQ = sessions.reduce((s,p)=>s+Number(p.attempted),0);
  if(totalQ<=0) return null;
  return Math.round(totalSec/totalQ);
}
function formatSeconds(sec){
  if(sec==null) return '—';
  if(sec<60) return sec+'s';
  return Math.floor(sec/60)+'m '+(sec%60)+'s';
}

let TEST_FILTER = { type:'' };

function subjectAvgFromTests(field){
  const withVal = DATA.tests.filter(t=>t[field]!=null);
  if(!withVal.length) return null;
  return Math.round(withVal.reduce((s,t)=>s+Number(t[field]),0)/withVal.length*10)/10;
}
function sparklineSvg(values, color){
  if(values.length<2) return '';
  const w=300, h=90, pad=10;
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const range = (max-min)||1;
  const stepX = (w-2*pad)/(values.length-1);
  const pts = values.map((v,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return {x,y};
  });
  const line = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}"></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:90px; display:block;">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
  </svg>`;
}
function renderTests(){

  }

    ${scoreChart}

    <div class="section-title">Test history
      <select id="testTypeFilter" style="width:auto; padding:6px 10px; font-size:12px; border-radius:8px; border:1px solid var(--line); background:var(--paper);">
        <option value="">All types</option>

      </select>
    </div>
    <div class="list">
      ${tests.length ? tests.map(testRowHtml).join('') : emptyState('📝','No tests added yet','Start tracking your first mock test.')}

  `;
  view('tests').innerHTML = html;

function saveTest(id){
  const name = $('#tt-name').value.trim();
  if(!name){ toast('Enter a test name'); return; }
  const physics = $('#tt-physics').value===''?null:Number($('#tt-physics').value);
  const chemistry = $('#tt-chemistry').value===''?null:Number($('#tt-chemistry').value);
  const maths = $('#tt-maths').value===''?null:Number($('#tt-maths').value);
  let total = $('#tt-total').value===''?null:Number($('#tt-total').value);
  if(physics!==null || chemistry!==null || maths!==null){
    total = (physics||0)+(chemistry||0)+(maths||0);
  }
  if(total===null){ toast('Enter total marks or subject-wise marks'); return; }
  const testType = $('#tt-type').value;
  let percentile = $('#tt-percentile').value===''?null:Number($('#tt-percentile').value);
  let percentileEstimated = false;
  if(percentile===null && testType==='JEE Main' && total!==null){
    percentile = estimateJeeMainPercentile(total);
    percentileEstimated = true;
  }
  const payload = {
    name, type: testType, date: $('#tt-date').value || todayStr(),
    physics, chemistry, maths, total,
    totalQuestions: $('#tt-totalq').value===''?null:Number($('#tt-totalq').value),
    questions: Number($('#tt-questions').value)||0,
    correct: Number($('#tt-correct').value)||0,
    wrong: Number($('#tt-wrong').value)||0,
    timeTaken: Number($('#tt-time').value)||0,
    percentile, percentileEstimated,
  };
  updateData(d=>{
    if(id) Object.assign(d.tests.find(t=>t.id===id), payload);
    else d.tests.push(Object.assign({id:uid()}, payload));
  });
  closeModal();
  renderAll();
  toast(id?'Test updated':'Test added');
}

let REVISION_TAB = 'due';

function completeRevision(revId){ updateData(d=>applyRevisionComplete(d,revId)); }
function applyRevisionComplete(d,revId,date){
  const r = d.revisions.find(x=>x.id===revId);
  if(!r) return;
  r.completed = true;
  r.completedDate = date||todayStr();
  const chapter = d.chapters.find(c=>c.id===r.chapterId);
  if(chapter){
    const totalRounds = d.revisions.filter(x=>x.chapterId===r.chapterId).length;
    chapter.revisionStatus = (r.round>=totalRounds) ? 'Completed' : 'In Progress';
    chapter.status = 'Revised';
    if(!chapter.completedOn) chapter.completedOn = todayStr();
  }
}
function sessionRevisionDone(d,x){
  if(x.type!=='Revision'||!x.chapter) return false;
  const ch=d.chapters.find(c=>c.subject===x.subject&&c.name===x.chapter); if(!ch) return false;
  const r=d.revisions.filter(v=>v.chapterId===ch.id&&!v.completed&&v.dueDate<=x.date).sort((a,b)=>a.dueDate.localeCompare(b.dueDate))[0];
  if(!r) return false; applyRevisionComplete(d,r.id,x.date); return true;
}
function uncompleteRevision(d,revId){ const r=d.revisions.find(x=>x.id===revId); if(r){ r.completed=false; r.completedDate=null; } }
function applyChapterField(d,id,field,val){
  const ch=d.chapters.find(c=>c.id===id); if(!ch) return;
  ch[field]=val;
  const all=!!(ch.notesDone&&ch.questionsDone&&ch.pyqsDone), any=!!(ch.notesDone||ch.questionsDone||ch.pyqsDone);
  if(ch.status!=='Revised'){
    if(all){ ch.status='Completed'; if(!ch.completedOn) ch.completedOn=todayStr(); scheduleRevisionsForChapter(id); }
    else if(any && ch.status==='Not Started') ch.status='Studying';
    else if(!all && ch.status==='Completed'){ ch.status='Studying'; ch.completedOn=null; }
  }
}

let REVISION_DATE = null, REVISION_MODE = 'daily', REVISION_MONTH = null, REVISION_CAL_OPEN = false;
function isoDate(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function revisionCalendarHtml(){

  return `<div class="hx-card rv-cal">

    ${REVISION_CAL_OPEN?`

      <div class="hd-head"><button class="rv-nav" data-rmonth="-1" aria-label="Previous month">&#8249;</button><div class="hx-h" style="margin:0">${label}</div><button class="rv-nav" data-rmonth="1" aria-label="Next month">&#8250;</button></div>

function renderRevision(){
  const t=todayStr();
  if(!REVISION_DATE) REVISION_DATE=t;
  if(!REVISION_MONTH){ const d=new Date(REVISION_DATE+'T00:00:00'); REVISION_MONTH={y:d.getFullYear(),m:d.getMonth()}; }
  const od=revisionsOverdue();
  const all=DATA.revisions;
  const doneAll=all.filter(r=>r.completed).length, pendAll=all.length-doneAll;
  let body='', head='';
  if(REVISION_MODE==='daily'){
    const isToday=REVISION_DATE===t;
    let list=all.filter(r=>r.dueDate===REVISION_DATE);
    if(isToday){
      od.forEach(r=>{ if(!list.includes(r)) list.push(r); });
      all.filter(r=>r.completed && r.completedDate===t).forEach(r=>{ if(!list.includes(r)) list.push(r); });
    }
    list=list.sort((a,b)=>(a.completed-b.completed)||a.dueDate.localeCompare(b.dueDate));
    const done=list.filter(r=>r.completed).length, pending=list.length-done;
    const progress=list.length?Math.round(done/list.length*100):0;
    head=revisionCalendarHtml()+`
    <div class="hx-card">
      <div class="hx-h" style="margin-bottom:8px">${plannerDayLabel(REVISION_DATE)}</div>
      <div class="pbar"><div style="width:${progress}%;background:#3DBE7E"></div></div>

        <div class="dl-tile" style="background:#3DBE7E"><b>${done}</b><span>Done</span></div>
        <div class="dl-tile" style="background:#F29A38"><b>${pending}</b><span>Pending</span></div>
        <div class="dl-tile" style="background:#E5484D"><b>${od.length}</b><span>Overdue</span></div>
      </div>
    </div>`;
    body=list.length ? list.map(revisionRowHtml).join('') : `<div class="hx-card" style="text-align:center;color:var(--ink-soft)">No revisions on this day.</div>`;
  } else {
    const progress=all.length?Math.round(doneAll/all.length*100):0;
    head=`<div class="hx-card">
      <div class="hx-h" style="margin-bottom:8px">All revisions</div>
      <div class="pbar"><div style="width:${progress}%;background:#3DBE7E"></div></div>
      <div class="dl-sum" style="margin:12px 0 0">
        <div class="dl-tile" style="background:#3DBE7E"><b>${doneAll}</b><span>Done</span></div>
        <div class="dl-tile" style="background:#F29A38"><b>${pendAll-od.length}</b><span>Upcoming</span></div>
        <div class="dl-tile" style="background:#E5484D"><b>${od.length}</b><span>Overdue</span></div>
      </div>
    </div>`;
    const sec=(title,col,items)=>{
      if(!items.length) return '';
      const dates=[...new Set(items.map(r=>r.completed?(r.completedDate||r.dueDate):r.dueDate))];
      return `<div class="dl-grp"><span class="dl-dot" style="background:${col}"></span><span>${title}</span><em>${items.length}</em></div>`+
        items.map(revisionRowHtml).join('');
    };
    const byDue=(a,b)=>a.dueDate.localeCompare(b.dueDate);
    const overdue=od.slice().sort(byDue);
    const today=all.filter(r=>!r.completed && r.dueDate===t);
    const upcoming=all.filter(r=>!r.completed && r.dueDate>t).sort(byDue);
    const completed=all.filter(r=>r.completed).sort((a,b)=>(b.completedDate||'').localeCompare(a.completedDate||''));
    body = all.length ? sec('Overdue','#E5484D',overdue)+sec('Due today','#F29A38',today)+sec('Upcoming','#3B82D6',upcoming)+sec('Completed','#3DBE7E',completed)
      : `<div class="hx-card" style="text-align:center;color:var(--ink-soft)">No revisions yet. Complete chapters to auto-schedule spaced revisions.</div>`;
  }
  view('revision').innerHTML = `
    <div class="pl-filters">
      <button class="pl-chip ${REVISION_MODE==='daily'?'on':''}" data-rmode="daily">Daily</button>
      <button class="pl-chip ${REVISION_MODE==='all'?'on':''}" data-rmode="all">All</button>
    </div>
    ${head}
    <div class="list">${body}</div>`;
  $all('[data-rmode]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{ REVISION_MODE=b.dataset.rmode; renderRevision(); }));
  const tg=$('#rvToggle'); if(tg) tg.addEventListener('click', ()=>{ REVISION_CAL_OPEN=!REVISION_CAL_OPEN; if(REVISION_CAL_OPEN){ const n=new Date(); REVISION_MONTH={y:n.getFullYear(),m:n.getMonth()}; } renderRevision(); });
  $all('[data-rdate]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{ REVISION_DATE=b.dataset.rdate; REVISION_CAL_OPEN=false; renderRevision(); }));
  $all('[data-rmonth]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{
    let {y,m}=REVISION_MONTH; m+=Number(b.dataset.rmonth); if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    REVISION_MONTH={y,m}; renderRevision();
  }));
  $all('[data-revaction]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{
    const id = b.closest('[data-id]').dataset.id;
    const act = b.dataset.revaction;

    else if(act==='edit') openEditRevisionDateModal(id);
    else if(act==='delete') confirmDelete('revision', id, 'Delete this revision entry?');
  }));
}

  const generalMin = allStudy().filter(x=>!x.subject).reduce((sum,x)=>sum+Number(x.minutes||0),0);
  const maxMin = Math.max(1, ...mins, generalMin);
  const colors = {Physics:'var(--indigo)', Chemistry:'var(--amber)', Mathematics:'var(--green)'};
  let rows = subjects.map((s,i)=>`<div class="hbar-row"><div class="hb-label">${s}</div><div class="hb-track"><div style="width:${pct(mins[i],maxMin)}%; background:${colors[s]};"></div></div><div class="hb-val">${hoursToHM(mins[i]/60)}</div></div>`).join('');
  if(generalMin>0) rows += `<div class="hbar-row"><div class="hb-label">General</div><div class="hb-track"><div style="width:${pct(generalMin,maxMin)}%; background:var(--slate);"></div></div><div class="hb-val">${hoursToHM(generalMin/60)}</div></div>`;
  return rows || `<p class="muted">No study sessions logged yet.</p>`;

function avgSessionLengthMin(){

function sumInRangeOffset(fn, days, offset){
  const arr = [];

function avgAccuracyInRange(offset, days){
  const start = addDays(todayStr(), -(offset+days-1));
  const end = addDays(todayStr(), -offset);
  const sessions = DATA.practiceSessions.filter(p=>p.date>=start && p.date<=end);
  const correct = sessions.reduce((s,p)=>s+Number(p.correct||0),0);
  const wrong = sessions.reduce((s,p)=>s+Number(p.wrong||0),0);
  return (correct+wrong) ? pct(correct, correct+wrong) : 0;
}
function compareCard(label, cur, prev, fmt){
  const f = fmt || (v=>v);
  const diff = cur - prev;
  const up = diff > 0, flat = diff===0;
  return `<div class="stat">
    <div class="val">${f(cur)}</div>
    <div class="lbl">${label}</div>
    <div class="cmp-delta" style="font-size:11px; font-weight:700; margin-top:2px; color:${flat?'var(--ink-soft)':(up?'var(--green)':'var(--red)')};">${flat?'No change':(up?'▲ ':'▼ ')+f(Math.abs(diff))+' vs last wk'}</div>
  </div>`;
}
function last8WeeksRevisionRate(){
  const weeks = [];
  for(let w=7; w>=0; w--){
    const start = addDays(todayStr(), -(w*7+6));
    const end = addDays(todayStr(), -(w*7));
    const count = DATA.revisions.filter(r=>r.completed && r.completedDate>=start && r.completedDate<=end).length;

}

var BLOCK_DAYS = [];
var BLOCK_REPEAT = 'once';
function ttDate(){ return TT_DATE || todayStr(); }
function blockKinds(){ return ['Study','Practice','Revision','Test','Break','Other']; }
function blockColor(kind){
  return ({Study:'var(--indigo)', Practice:'var(--amber)', Revision:'var(--red)', Test:'var(--slate)', Break:'var(--green)', Other:'var(--slate)'})[kind] || 'var(--slate)';
}
function blockHasSubject(kind){ return kind==='Study' || kind==='Practice' || kind==='Revision'; }
function hmToMin(t){ const p = String(t||'0:0').split(':'); return (Number(p[0])||0)*60 + (Number(p[1])||0); }
function minToHM(m){ m = Math.max(0, Math.min(1439, Math.round(m))); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function fmtTime12(t){
  const m = hmToMin(t); let h = Math.floor(m/60); const mm = m%60;
  const ap = h>=12 ? 'PM' : 'AM'; h = h%12 || 12;
  return h+':'+String(mm).padStart(2,'0')+' '+ap;
}
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function nowMinutes(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function blockMins(b){ return Math.max(0, hmToMin(b.end) - hmToMin(b.start)); }
function blockTitle(b){ return b.title || b.chapter || b.kind; }
function mockOn(d){ return DATA.studySessions.some(x=>x.type==='Mock'&&x.date===d); }
function lastMockDate(){
  const lt=latestTest(), ms=DATA.studySessions.filter(x=>x.type==='Mock').map(x=>x.date);
  return [lt&&lt.date,...ms].filter(Boolean).sort().pop()||null;
}
/* Blocks finished by what was logged that day (any time of day, several sessions add up). */
function autoDoneIds(date){
  const out=new Set(), pools={Study:[],Revision:[],Practice:[]};
  DATA.studySessions.filter(x=>x.date===date).forEach(x=>{
    const k=x.type==='Revision'?'Revision':(x.type==='Practice'||x.type==='Mock')?null:'Study';
    if(k) pools[k].push({subject:x.subject||'',chapter:x.chapter||'',rem:Number(x.minutes)||0});
  });
  DATA.practiceSessions.filter(x=>x.date===date).forEach(x=>pools.Practice.push({subject:x.subject||'',chapter:x.chapter||'',rem:Number(x.timeMinutes)||0}));
  blocksForDate(date).filter(b=>pools[b.kind]&&(!b.link||b.link.type==='pyq')).forEach(b=>{
    let need=blockMins(b); if(need<=0) return;
    pools[b.kind].filter(x=>(!b.subject||x.subject===b.subject)&&(!b.chapter||x.chapter===b.chapter)).forEach(x=>{ const t=Math.min(x.rem,need); x.rem-=t; need-=t; });
    if(need<=0) out.add(b.id);
  });
  return out;
}
function blockIsDone(b, dateStr){
  if((b.doneDates||[]).includes(dateStr)) return true;
  if((b.noAuto||[]).includes(dateStr)) return false;
  const L=b.link;
  if(L&&L.type==='revision'){ const r=DATA.revisions.find(x=>x.id===L.id); return !!(r&&r.completed); }
  if(b.kind==='Test'||(L&&L.type==='test')) return DATA.tests.some(t=>t.date===dateStr)||mockOn(dateStr);
  if(L&&L.type==='pyq'){ const c=DATA.chapters.find(x=>x.id===L.id); if(c&&c.pyqsDone) return true; }
  return autoDoneIds(dateStr).has(b.id);
}
function blocksForDate(dateStr){
  const wd = weekdayOf(dateStr);
  return (DATA.timeBlocks||[]).filter(b=>{
    if((b.skipDates||[]).includes(dateStr)) return false;
    if(b.repeat==='days') return dateStr >= (b.from||'0000-00-00') && (b.days||[]).includes(wd);
    return b.date===dateStr;
  }).sort((a,b)=> hmToMin(a.start)-hmToMin(b.start) || hmToMin(a.end)-hmToMin(b.end));
}
function blockStatus(b, dateStr){
  if(blockIsDone(b, dateStr)) return 'done';
  const today = todayStr();
  if(dateStr < today) return 'missed';
  if(dateStr > today) return 'upcoming';
  const now = nowMinutes();
  if(hmToMin(b.end) <= now) return 'missed';
  if(hmToMin(b.start) <= now) return 'now';
  return 'upcoming';
}
function ttDateLabel(dateStr){

  else if(dateStr===addDays(t,-1)) tag = 'Yesterday';

function ttEntries(date){

function linkedBlockFor(type,id){

function ttSuggestions(date){
  const out=[]; const add=(type,id)=>{ const s=sugInfo(type,id); if(s){ s.block=linkedBlockFor(type,s.id); out.push(s); } };
  DATA.revisions.filter(r=>!r.completed&&r.dueDate<=date).sort((a,b)=>a.dueDate.localeCompare(b.dueDate)).forEach(r=>add('revision',r.id));

function toggleBlockDone(id, date){
  const b=(DATA.timeBlocks||[]).find(x=>x.id===id); if(!b) return;
  const was=blockIsDone(b,date), L=b.link;
  if(!was && L && L.type==='pyq'){ askPyqDone(id,date); return; }
  updateData(d=>{
    const x=d.timeBlocks.find(y=>y.id===id); x.doneDates=x.doneDates||[];
    const i=x.doneDates.indexOf(date);
    if(was){
      if(i>-1) x.doneDates.splice(i,1);
      if(L&&L.type==='revision') uncompleteRevision(d,L.id);
      if(L&&L.type==='pyq') applyChapterField(d,L.id,'pyqsDone',false);
      if(blockIsDone(x,date)){ x.noAuto=x.noAuto||[]; if(!x.noAuto.includes(date)) x.noAuto.push(date); }
    } else {
      x.doneDates.push(date);
      if(L&&L.type==='revision') applyRevisionComplete(d,L.id);
    }

function findFreeSlot(date,mins,ignoreId){
  const busy=ttEntries(date).filter(e=>e.id!==ignoreId).map(e=>[hmToMin(e.start),hmToMin(e.end)]);
  let s=6*60; if(date===todayStr()) s=Math.max(s,Math.ceil((nowMinutes()+5)/15)*15);
  for(const [a,b] of busy){ if(a>=s+mins) break; if(b>s) s=b; }
  return minToHM(Math.min(s,1440-mins));
}

function slotHint(){
  const el=$('#sl-hint'); if(!el) return;
  const date=$('#sl-date').value, start=$('#sl-start').value, dur=Number($('#sl-dur').value)||0;
  if(!date||!start||dur<=0){ el.textContent=''; return; }
  const a=hmToMin(start), b=a+dur;
  const hit=ttEntries(date).find(e=>e.id!==el.dataset.ex && hmToMin(e.start)<b && hmToMin(e.end)>a);
  el.textContent = hit ? `Overlaps with "${hit.title}" (${fmtTime12(hit.start)} – ${fmtTime12(hit.end)})` : `Ends at ${fmtTime12(minToHM(b))} · slot is free`;
  el.style.color = hit ? 'var(--red)' : 'var(--ink-soft)';
}
function saveSlot(type,id){
  const s=sugInfo(type,id); if(!s) return;
  const date=$('#sl-date').value, start=$('#sl-start').value, dur=Number($('#sl-dur').value)||0;
  if(!date||!start||dur<=0){ toast('Set date, start time and duration'); return; }
  if(hmToMin(start)+dur>1439){ toast('Slot must end before midnight'); return; }
  const end=minToHM(hmToMin(start)+dur), ex=linkedBlockFor(type,s.id);
  updateData(d=>{
    d.timeBlocks=d.timeBlocks||[];
    const payload={title:s.title,kind:s.kind,start,end,subject:s.subject||'',chapter:s.chapter||'',repeat:'once',date,days:[],link:{type:s.type,id:s.id}};
    const x=ex&&d.timeBlocks.find(b=>b.id===ex.id);

    if(type==='revision'){ const r=d.revisions.find(r=>r.id===s.id); if(r) r.dueDate=date; }

/* After midnight, unfinished one-day blocks of earlier days are copied to the new day automatically.
   The original stays behind as "Missed" history; the copy carries a "Carried from" tag. */
function carryOverBlocks(){
  const t=todayStr(), now=nowMinutes(), kinds=['Study','Practice','Revision','Test'];
  let moved=0, changed=false;
  (DATA.timeBlocks||[]).slice().forEach(o=>{   // original finished later on -> its pending copy is no longer needed
    if(!o.carriedTo || !blockIsDone(o,o.date)) return;
    const c=DATA.timeBlocks.find(x=>x.id===o.carriedTo);
    if(c && !blockIsDone(c,c.date)){ DATA.timeBlocks=DATA.timeBlocks.filter(x=>x.id!==c.id); o.carriedTo=null; changed=true; }
  });
  (DATA.timeBlocks||[]).slice().forEach(o=>{
    if(o.repeat!=='once' || o.carriedTo || !o.date || !kinds.includes(o.kind)) return;
    if(o.date>=t || blockIsDone(o,o.date)) return;
    const T = t, mins=blockMins(o);
    const busy = ttEntries(T).some(e=>hmToMin(e.start)<hmToMin(o.end) && hmToMin(e.end)>hmToMin(o.start));
    let start=o.start, end=o.end;
    if(busy || hmToMin(o.end)<=now){ start=findFreeSlot(T,mins); end=minToHM(hmToMin(start)+mins); }
    const c=Object.assign({},o,{id:uid(),date:T,from:T,start,end,doneDates:[],skipDates:[],noAuto:[],carriedTo:null,carriedFrom:o.carriedFrom||o.date});
    DATA.timeBlocks.push(c); o.carriedTo=c.id; moved++;
    if(o.link && o.link.type==='revision'){ const r=DATA.revisions.find(x=>x.id===o.link.id); if(r && !r.completed && r.dueDate<T) r.dueDate=T; }
  });
  if(moved||changed) saveData();
  return moved;
}

function setTimerMode(mode){
  if(TimerState.running) return toast('Stop the current session first');
  TimerState.mode = mode;
  TimerState.phase = 'study';
  TimerState.pomoCount = 0;
  TimerState.elapsedSec = 0;
  renderTimer();
}
function currentPhaseTotalSec(){
  const s = DATA.settings;
  if(TimerState.phase==='study') return s.pomodoroMinutes*60;
  if(TimerState.phase==='longbreak') return s.pomodoroLongBreak*60;
  return s.pomodoroBreak*60;
}
function renderTimerText(){
  if(TimerState.mode==='stopwatch') return secToClock(TimerState.elapsedSec);
  const remaining = Math.max(0, currentPhaseTotalSec() - TimerState.elapsedSec);
  return secToClock(remaining);
}
function timerTicksSvg(){
  let out = '';
  for(let i=0;i<60;i++){
    const a = i*Math.PI/30, sn = Math.sin(a), cs = Math.cos(a);
    const r1 = (i%5===0) ? 117 : 120, r2 = 127;
    out += `<line class="timer-tick" data-i="${i}" x1="${(130+r1*sn).toFixed(2)}" y1="${(130-r1*cs).toFixed(2)}" x2="${(130+r2*sn).toFixed(2)}" y2="${(130-r2*cs).toFixed(2)}"/>`;
  }
  return out;
}
/* Recomputes elapsed seconds from the wall clock so the timer stays right even if the tab was throttled. */
function syncTimerElapsed(){
  if(TimerState.running) TimerState.elapsedSec = TimerState.baseSec + Math.floor((Date.now()-TimerState.startedAtMs)/1000);
}
function updateTimerVisual(){
  const disp = $('#timerDisplay');
  if(!disp) return;
  const txt = renderTimerText();
  disp.textContent = txt;
  disp.classList.toggle('long', txt.length>5);
  // ring: pomodoro drains as the phase runs out, stopwatch sweeps once every minute
  const preciseSec = TimerState.running ? TimerState.baseSec + (Date.now()-TimerState.startedAtMs)/1000 : TimerState.elapsedSec;
  let v;
  if(TimerState.mode==='pomodoro') v = Math.max(0, 1 - preciseSec/currentPhaseTotalSec());
  else v = (preciseSec % 60)/60;
  const prog = $('#timerProg'), dot = $('#timerDot');
  if(prog){
    if(v < TimerState.lastV - 0.5){ prog.style.transition='none'; prog.getBoundingClientRect(); prog.style.transition=''; }  // no backwards sweep at the wrap
    prog.style.strokeDashoffset = TIMER_C*(1-v); prog.style.opacity = v<0.002 ? 0 : '';
  }
  TimerState.lastV = v;
  if(dot){
    const a = v*2*Math.PI;
    dot.setAttribute('cx', (130+TIMER_R*Math.sin(a)).toFixed(2));
    dot.setAttribute('cy', (130-TIMER_R*Math.cos(a)).toFixed(2));
    dot.style.opacity = (v<0.002 && TimerState.elapsedSec===0) ? 0.0 : 1;
  }
  // outer second ticks
  const sec = TimerState.elapsedSec % 60;
  if(sec !== TimerState.lastTickSec){
    TimerState.lastTickSec = sec;
    $all('.timer-tick').forEach((t,i)=>{
      t.classList.toggle('on', i<sec);
      t.classList.toggle('now', i===sec && TimerState.running);
    });
  }
}
function startTimer(){
  if(TimerState.running) return;
  TimerState.running = true;
  TimerState.baseSec = TimerState.elapsedSec;
  TimerState.startedAtMs = Date.now();
  TimerState.intervalId = setInterval(()=>{
    syncTimerElapsed();
    if(TimerState.mode==='pomodoro' && TimerState.elapsedSec >= currentPhaseTotalSec()){
      handlePomodoroPhaseEnd();
      return;
    }
    updateTimerVisual();
  },250);
  renderTimer();
}
function pauseTimer(){
  syncTimerElapsed();
  TimerState.running = false;
  clearInterval(TimerState.intervalId);
  renderTimer();
}
function handlePomodoroPhaseEnd(){
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  TimerState.justFinished = true;
  if(TimerState.phase==='study'){
    logStudyMinutesPrompt(DATA.settings.pomodoroMinutes);
    TimerState.pomoCount += 1;
    TimerState.phase = (TimerState.pomoCount % 4 === 0) ? 'longbreak' : 'break';
  } else {
    TimerState.phase = 'study';
  }
  TimerState.elapsedSec = 0;
  toast(TimerState.phase==='study' ? 'Break over — back to focus!' : 'Focus session complete — take a break');
  renderTimer();
}
function stopTimer(){
  syncTimerElapsed();
  if(TimerState.elapsedSec < 1){ resetTimer(); return; }
  const minutes = TimerState.mode==='stopwatch' ? TimerState.elapsedSec/60 : Math.min(TimerState.elapsedSec, currentPhaseTotalSec())/60;
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  if(TimerState.mode==='pomodoro' && TimerState.phase!=='study'){
    // break session, don't log study time
    resetTimer();
    return;
  }
  logStudyMinutesPrompt(minutes);
  resetTimer();
}
function resetTimer(){
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  TimerState.elapsedSec = 0;
  TimerState.baseSec = 0;
  TimerState.phase = 'study';
  TimerState.pomoCount = 0;
  renderTimer();
}

function profileOverallHtml(){
  const T=DATA.tests, rec=computeRecords(), rd=readinessScore();
  const key={Physics:'physics',Chemistry:'chemistry',Mathematics:'maths'};
  const vals=(sub)=>T.map(t=>t[key[sub]]).filter(v=>v!=null&&v!=='').map(Number);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const mx=a=>a.length?Math.max(...a):null;
  const fmt=v=>v==null?'—':v;
  const tile=(l,v,sub)=>`<div class="pf-box"><div class="l">${l}</div><div class="n">${v}</div>${sub?`<div class="l" style="margin:4px 0 0">${sub}</div>`:''}</div>`;
  const grp=(t,items,c)=>`<div class="pf-lbl">${t}</div><div class="pf-row" style="grid-template-columns:1fr 1fr;flex-wrap:wrap">${items.map(x=>x.replace('class="pf-box"','class="pf-box '+c+'"')).join('')}</div>`;
  const tot=T.map(t=>Number(t.total||0));
  const spanDays=(arr)=>{ const ds=arr.map(x=>x.date).filter(Boolean).sort(); return ds.length ? Math.max(1,Math.round((new Date(todayStr())-new Date(ds[0]))/864e5)+1) : 0; };

  const totQ=PS.reduce((a,x)=>a+Number(x.attempted||0),0);
  const totMin=SS.reduce((a,x)=>a+Number(x.minutes||0),0);
  const qDays=spanDays(PS), sDays=spanDays(SS);
  const corr=PS.reduce((a,x)=>a+Number(x.correct||0),0), wr=PS.reduce((a,x)=>a+Number(x.wrong||0),0);
  const doneCh=DATA.chapters.filter(c=>c.status==='Completed'||c.status==='Revised').length;
  const rc=rd.score>=70?'var(--green)':rd.score>=40?'var(--amber)':'var(--red)';
  const best=[
    tile('Best study day',hoursToHM(rec.bestDayHours),rec.bestDayDate?fmtDateShort(rec.bestDayDate):''),

    tile('Best mock score',fmt(rec.bestScore),'Mock test'),
    ...Object.keys(key).map(n=>tile('Best '+n,fmt(mx(vals(n))),'Mock test marks'))
  ];
  if(rec.bestJump!=null) best.push(tile('Best mock jump',(rec.bestJump>=0?'+':'')+rec.bestJump,'Mock test'));
  const average=[
    tile('Average mock score',fmt(avg(tot)),'Mock test'),
    ...Object.keys(key).map(n=>tile('Average '+n,fmt(avg(vals(n))),'Mock test marks')),
    tile('Avg questions / day',qDays?Math.round(totQ/qDays):'—','Since first practice'),
    tile('Avg study / day',sDays?hoursToHM(totMin/60/sDays):'—','Since first session'),
    tile('Avg practice accuracy',(corr+wr)?Math.round(corr/(corr+wr)*100)+'%':'—','All practice'),
    tile('Avg questions / session',PS.length?Math.round(totQ/PS.length):'—',''),
    tile('Avg time / question',formatSeconds(avgTimePerQuestion()),''),
    tile('Avg session length',avgSessionLengthMin()+'m','')
  ];
  const total=[
    tile('Total study time',hoursToHM(allStudy().reduce((a,x)=>a+Number(x.minutes||0),0)/60),''),
    tile('Total questions',DATA.practiceSessions.reduce((a,x)=>a+Number(x.attempted||0),0),''),
    tile('Total tests',T.length,''),
    tile('Chapters completed',doneCh,'of '+DATA.chapters.length)
  ];

  $('#pf-save').addEventListener('click',()=>{
    const nm=$('#pf-name').value.trim();
    updateData(d=>{ d.settings.studentName=nm; if(photo!==undefined) d.settings.photoSvg=photo; });
    closeModal(); renderAll(); toast('Profile updated');
  });
}

function renderMore(){
  const ICO = moreIco();
  const od = dueNowChapters().length, rv = revisionsOverdue().length + revisionsDueToday().length;
  // [key, title, subtitle, icon, badge]
  const groups = [
    ['Study', [
      ['timer','Study Timer','Start a focus session',ICONS.timer],
      ['practice','Practice','Log your questions',ICONS.practice],
      ['revision','Revision', rv ? rv+' due or overdue' : 'Nothing pending',ICONS.revision, rv],
    ]],
    ['Track', [
      ['analytics','Progress','Hours, accuracy and trends',ICONS.analytics],
      ['goal','My Goal','Target and daily plan',ICONS.goal],
      ['deadlines','Deadlines', od ? od+' chapter'+(od===1?'':'s')+' need attention' : 'Chapter due dates',ICO.deadline, od],
    ]],
    ['Extras', [
      ['rewards','Rewards', coinBalance()+' coins',ICONS.reward],
      ['share','Share Progress',"Send today's summary",ICO.share],
    ]]
  ];
  if(DEFERRED_INSTALL_PROMPT) groups[2][1].push(['install','Install App','Add to your home screen',ICO.install]);
  $('#view-more').innerHTML = groups.map(g=>`
    <div class="mr-lbl">${g[0]}</div>
    <div class="mr-card">${g[1].map(i=>`
      <button type="button" class="mr-row" data-more="${i[0]}">
        <span class="mr-ic">${i[3]}</span>
        <span class="mr-main"><b>${i[1]}</b><small>${i[2]}</small></span>
        ${i[4]?`<span class="mb-badge2">${i[4]}</span>`:''}
        <span class="mr-chev">&#8250;</span>
      </button>`).join('')}
    </div>`).join('');
  $all('[data-more]', $('#view-more')).forEach(b=>b.addEventListener('click', async ()=>{
    const k=b.dataset.more;
    if(k==='share') openShareCardModal();
    else if(k==='deadlines') openDeadlinePanel();
    else if(k==='install'){ if(!DEFERRED_INSTALL_PROMPT) return; DEFERRED_INSTALL_PROMPT.prompt(); await DEFERRED_INSTALL_PROMPT.userChoice; DEFERRED_INSTALL_PROMPT=null; renderMore(); }
    else switchView(k);
  }));
}

var AN_TAB='week';
function moreIco(){ return {"share": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"18\" cy=\"5\" r=\"2.5\"/><circle cx=\"6\" cy=\"12\" r=\"2.5\"/><circle cx=\"18\" cy=\"19\" r=\"2.5\"/><path d=\"m8.2 10.8 7.6-4.6M8.2 13.2l7.6 4.6\"/></svg>", "deadline": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M8 3v4M16 3v4M3.5 10h17\"/></svg>", "install": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14\"/></svg>"}; }
/* ---------- Quick actions grid (2 rows, >=3 cols, square tiles, customisable) ---------- */
function qaPool(){
  const I=moreIco();
  return [
    {id:'session',label:'Start Session',ic:ICONS.timer,run:()=>handleQuickAction('session')},
    {id:'task',label:'Add Slot',ic:ICONS.add_task,run:()=>handleQuickAction('block')},
    {id:'questions',label:'Add Questions',ic:ICONS.practice,run:()=>handleQuickAction('practice')},
    {id:'test',label:'Add Test',ic:ICONS.tests,run:()=>handleQuickAction('test')},
    {id:'timetable',label:'Timetable',ic:ICONS.clock,run:()=>switchView('timetable')},
    {id:'chapters',label:'Chapters',ic:ICONS.chapters,run:()=>switchView('chapters')},
    {id:'goal',label:'My Goal',ic:ICONS.goal,run:()=>switchView('goal')},
    {id:'practice',label:'Practice',ic:ICONS.practice,run:()=>switchView('practice')},
    {id:'revision',label:'Revision',ic:ICONS.revision,run:()=>switchView('revision')},
    {id:'deadlines',label:'Deadlines',ic:I.deadline,run:()=>openDeadlinePanel()},
    {id:'rewards',label:'Rewards',ic:ICONS.reward,run:()=>switchView('rewards')},
    {id:'analytics',label:'Analytics',ic:ICONS.analytics,run:()=>switchView('analytics')},
    {id:'share',label:'Share',ic:I.share,run:()=>openShareCardModal()}
  ];
}
function qaIds(){
  const pool=qaPool().map(x=>x.id), saved=DATA.settings.qaList;
  const ids=Array.isArray(saved)?saved.filter(i=>pool.includes(i)):[];
  return ids.length ? ids : pool;
}
function qaCols(){
  const el=$('#qaGrid'); const w=(el&&el.clientWidth)||(view('home').clientWidth)||360;
  return Math.min(6, Math.max(3, Math.floor((w+10)/(88+10))));
}
function renderQuickGrid(){
  const g=$('#qaGrid'); if(!g) return;
  const cols=qaCols(), pool=qaPool();
  const items=qaIds().map(id=>pool.find(x=>x.id===id)).slice(0,cols*2);
  g.style.setProperty('--cols',cols);
  g.innerHTML=items.map(x=>`<button class="qa-tile" data-qid="${x.id}">${x.ic}<span>${x.label}</span></button>`).join('');
  $all('.qa-tile',g).forEach(b=>b.addEventListener('click',()=>pool.find(x=>x.id===b.dataset.qid).run()));
}
let _qaRz; window.addEventListener('resize',()=>{ clearTimeout(_qaRz); _qaRz=setTimeout(()=>{ if(CURRENT_VIEW==='home') renderQuickGrid(); },120); });
function openQaCustomise(){
  const pool=qaPool(), on=qaIds();
  let list=on.concat(pool.map(x=>x.id).filter(i=>!on.includes(i))), sel=new Set(on);
  const draw=()=>{
    $('#qaList').innerHTML=list.map((id,i)=>{ const x=pool.find(p=>p.id===id); return `<div class="qa-row2">
      <label><input type="checkbox" data-c="${id}" ${sel.has(id)?'checked':''}><span class="qa-ico">${x.ic}</span>${x.label}</label>
      <span><button type="button" class="qa-mv" data-u="${i}" aria-label="Up">&#9650;</button><button type="button" class="qa-mv" data-d="${i}" aria-label="Down">&#9660;</button></span></div>`; }).join('');
    $all('[data-c]',$('#qaList')).forEach(c=>c.addEventListener('change',()=>{ c.checked?sel.add(c.dataset.c):sel.delete(c.dataset.c); }));
    $all('[data-u]',$('#qaList')).forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.u; if(i>0){ [list[i-1],list[i]]=[list[i],list[i-1]]; draw(); } }));
    $all('[data-d]',$('#qaList')).forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.d; if(i<list.length-1){ [list[i+1],list[i]]=[list[i],list[i+1]]; draw(); } }));
  };
  openModal(`<div class="modal-head"><h3>Quick actions</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="muted" style="margin-bottom:12px">Tick the ones you want and set the order. Each screen shows as many as fit in 2 rows, from the top.</p>
    <div id="qaList"></div>
    <div class="modal-actions"><button class="btn secondary" id="qaReset" type="button">Reset</button><button class="btn" id="qaSave" type="button">Save</button></div>`);
  draw();
  $('#qaReset').addEventListener('click',()=>{ updateData(d=>{ d.settings.qaList=null; }); closeModal(); renderQuickGrid(); });
  $('#qaSave').addEventListener('click',()=>{ const out=list.filter(i=>sel.has(i)); updateData(d=>{ d.settings.qaList=out.length?out:null; }); closeModal(); renderQuickGrid(); });
}
</script>
