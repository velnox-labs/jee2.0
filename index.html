    <div style="margin-bottom:16px;">${compareCard('Tests this week', wkTests, prevWkTests)}</div>
    ${avgRankCard}
    ${avgAttemptRate!==null ? `<div class="card-flat" style="margin-bottom:16px;"><div class="lbl muted">Average attempt rate</div><div style="font-weight:700; font-size:18px;">${avgAttemptRate}% of paper attempted</div></div>` : ''}
    ${improvement}
    ${scoreChart}
    ${percentileChart}
    ${subjectAvgCard}
    <div class="section-title">Test history
      <select id="testTypeFilter" style="width:auto; padding:6px 10px; font-size:12px; border-radius:8px; border:1px solid var(--line); background:var(--paper);">
        <option value="">All types</option>
        ${['JEE Main','JEE Advanced','Chapter Test','Full Syllabus','Custom'].map(t=>`<option ${TEST_FILTER.type===t?'selected':''}>${t}</option>`).join('')}
      </select>
    </div>
    <button class="btn block" style="margin-bottom:14px;" onclick="openTestModal()">+ Add Mock Test</button>
    <div class="list">
      ${tests.length ? tests.map(testRowHtml).join('') : emptyState('📝','No tests added yet','Start tracking your first mock test.')}
    </div>
  `;
  view('tests').innerHTML = html;
  $('#testTypeFilter').addEventListener('change', e=>{ TEST_FILTER.type=e.target.value; renderTests(); });
  $all('[data-testaction]', view('tests')).forEach(b=>b.addEventListener('click', ()=>{

function saveTest(id){
  const name = $('#tt-name').value.trim();
  if(!name){ toast('Enter a test name'); return; }
  const physics = $('#tt-physics').value===''?null:Number($('#tt-physics').value);
  const chemistry = $('#tt-chemistry').value===''?null:Number($('#tt-chemistry').value);
  const maths = $('#tt-maths').value===''?null:Number($('#tt-maths').value);
  let total = $('#tt-total').value===''?null:Number($('#tt-total').value);
  if(physics!==null || chemistry!==null || maths!==null){
    total = (physics||0)+(chemistry||0)+(maths||0);
  }
  if(total===null){ toast('Enter total marks or subject-wise marks'); return; }
  const testType = $('#tt-type').value;
  let percentile = $('#tt-percentile').value===''?null:Number($('#tt-percentile').value);
  let percentileEstimated = false;
  if(percentile===null && testType==='JEE Main' && total!==null){
    percentile = estimateJeeMainPercentile(total);
    percentileEstimated = true;
  }
  const payload = {
    name, type: testType, date: $('#tt-date').value || todayStr(),
    physics, chemistry, maths, total,
    totalQuestions: $('#tt-totalq').value===''?null:Number($('#tt-totalq').value),
    questions: Number($('#tt-questions').value)||0,
    correct: Number($('#tt-correct').value)||0,
    wrong: Number($('#tt-wrong').value)||0,
    timeTaken: Number($('#tt-time').value)||0,
    percentile, percentileEstimated,
  };
  updateData(d=>{
    if(id) Object.assign(d.tests.find(t=>t.id===id), payload);
    else d.tests.push(Object.assign({id:uid()}, payload));
  });
  closeModal();
  renderAll();
  toast(id?'Test updated':'Test added');
}

let REVISION_TAB = 'due';

function completeRevision(revId){
  updateData(d=>{
    const r = d.revisions.find(x=>x.id===revId);
    if(!r) return;
    r.completed = true;
    r.completedDate = todayStr();
    const chapter = d.chapters.find(c=>c.id===r.chapterId);
    if(chapter){
      const totalRounds = d.revisions.filter(x=>x.chapterId===r.chapterId).length;
      chapter.revisionStatus = (r.round>=totalRounds) ? 'Completed' : 'In Progress';
      chapter.status = 'Revised';
      if(!chapter.completedOn) chapter.completedOn = todayStr();
    }
  });
}

let REVISION_DATE = null, REVISION_MODE = 'daily', REVISION_MONTH = null, REVISION_CAL_OPEN = false;
function isoDate(y,m,d){ return y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0'); }
function revisionCalendarHtml(){
  const t=todayStr();
  const y=REVISION_MONTH.y, m=REVISION_MONTH.m;
  const first=new Date(y,m,1), days=new Date(y,m+1,0).getDate();
  const offset=(first.getDay()+6)%7; // Monday first
  const info={};
  DATA.revisions.forEach(r=>{
    const o=info[r.dueDate]||(info[r.dueDate]={over:0,pend:0,done:0});
    if(r.completed) o.done++; else if(r.dueDate<t) o.over++; else o.pend++;
  });
  let cells='';
  for(let k=0;k<offset;k++) cells+='<span class="rv-c empty"></span>';
  for(let d=1; d<=days; d++){
    const iso=isoDate(y,m,d), o=info[iso];
    const dot=!o?'transparent':o.over?'#E5484D':o.pend?'#F29A38':'#3DBE7E';
    cells+=`<button class="rv-c ${iso===REVISION_DATE?'on':''} ${iso===t?'today':''}" data-rdate="${iso}"><b>${d}</b><i style="background:${iso===REVISION_DATE&&o?'#fff':dot}"></i></button>`;
  }
  const label=first.toLocaleDateString('en-IN',{month:'long',year:'numeric'});
  const o=info[REVISION_DATE];
  const chip=o?(o.over?`<em style="background:#E5484D">${o.over} overdue</em>`:'')+(o.pend?`<em style="background:#F29A38">${o.pend} due</em>`:'')+(o.done?`<em style="background:#3DBE7E">${o.done} done</em>`:''):'';
  const CAL='<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="2.5"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>';
  return `<div class="hx-card rv-cal">
    <button class="rv-toggle" id="rvToggle" aria-expanded="${REVISION_CAL_OPEN}">${CAL}<span class="rv-sel">${plannerDayLabel(REVISION_DATE)}</span>${chip}<span class="rv-chev ${REVISION_CAL_OPEN?'open':''}">&#9662;</span></button>
    ${REVISION_CAL_OPEN?`
    <div class="rv-body">
      <div class="hd-head"><button class="rv-nav" data-rmonth="-1" aria-label="Previous month">&#8249;</button><div class="hx-h" style="margin:0">${label}</div><button class="rv-nav" data-rmonth="1" aria-label="Next month">&#8250;</button></div>
      <div class="rv-grid rv-head"><span>Mo</span><span>Tu</span><span>We</span><span>Th</span><span>Fr</span><span>Sa</span><span>Su</span></div>
      <div class="rv-grid">${cells}</div>
      <div class="rv-legend"><span><i style="background:#E5484D"></i>Overdue</span><span><i style="background:#F29A38"></i>Due</span><span><i style="background:#3DBE7E"></i>Done</span></div>
    </div>`:''}
  </div>`;
}
function renderRevision(){
  const t=todayStr();
  if(!REVISION_DATE) REVISION_DATE=t;
  if(!REVISION_MONTH){ const d=new Date(REVISION_DATE+'T00:00:00'); REVISION_MONTH={y:d.getFullYear(),m:d.getMonth()}; }
  const od=revisionsOverdue();
  const all=DATA.revisions;
  const doneAll=all.filter(r=>r.completed).length, pendAll=all.length-doneAll;
  let body='', head='';
  if(REVISION_MODE==='daily'){
    const isToday=REVISION_DATE===t;
    let list=all.filter(r=>r.dueDate===REVISION_DATE);
    if(isToday){
      od.forEach(r=>{ if(!list.includes(r)) list.push(r); });
      all.filter(r=>r.completed && r.completedDate===t).forEach(r=>{ if(!list.includes(r)) list.push(r); });
    }
    list=list.sort((a,b)=>(a.completed-b.completed)||a.dueDate.localeCompare(b.dueDate));
    const done=list.filter(r=>r.completed).length, pending=list.length-done;
    const progress=list.length?Math.round(done/list.length*100):0;
    head=revisionCalendarHtml()+`
    <div class="hx-card">
      <div class="hx-h" style="margin-bottom:8px">${plannerDayLabel(REVISION_DATE)}</div>
      <div class="pbar"><div style="width:${progress}%;background:#3DBE7E"></div></div>
      <div class="dl-sum" style="margin:12px 0 0">
        <div class="dl-tile" style="background:#3DBE7E"><b>${done}</b><span>Done</span></div>
        <div class="dl-tile" style="background:#F29A38"><b>${pending}</b><span>Pending</span></div>
        <div class="dl-tile" style="background:#E5484D"><b>${od.length}</b><span>Overdue</span></div>
      </div>
    </div>`;
    body=list.length ? list.map(revisionRowHtml).join('') : `<div class="hx-card" style="text-align:center;color:var(--ink-soft)">No revisions on this day.</div>`;
  } else {
    const progress=all.length?Math.round(doneAll/all.length*100):0;
    head=`<div class="hx-card">
      <div class="hx-h" style="margin-bottom:8px">All revisions</div>
      <div class="pbar"><div style="width:${progress}%;background:#3DBE7E"></div></div>
      <div class="dl-sum" style="margin:12px 0 0">
        <div class="dl-tile" style="background:#3DBE7E"><b>${doneAll}</b><span>Done</span></div>
        <div class="dl-tile" style="background:#F29A38"><b>${pendAll-od.length}</b><span>Upcoming</span></div>
        <div class="dl-tile" style="background:#E5484D"><b>${od.length}</b><span>Overdue</span></div>
      </div>
    </div>`;
    const sec=(title,col,items)=>{
      if(!items.length) return '';
      const dates=[...new Set(items.map(r=>r.completed?(r.completedDate||r.dueDate):r.dueDate))];
      return `<div class="dl-grp"><span class="dl-dot" style="background:${col}"></span><span>${title}</span><em>${items.length}</em></div>`+
        items.map(revisionRowHtml).join('');
    };
    const byDue=(a,b)=>a.dueDate.localeCompare(b.dueDate);
    const overdue=od.slice().sort(byDue);
    const today=all.filter(r=>!r.completed && r.dueDate===t);
    const upcoming=all.filter(r=>!r.completed && r.dueDate>t).sort(byDue);
    const completed=all.filter(r=>r.completed).sort((a,b)=>(b.completedDate||'').localeCompare(a.completedDate||''));
    body = all.length ? sec('Overdue','#E5484D',overdue)+sec('Due today','#F29A38',today)+sec('Upcoming','#3B82D6',upcoming)+sec('Completed','#3DBE7E',completed)
      : `<div class="hx-card" style="text-align:center;color:var(--ink-soft)">No revisions yet. Complete chapters to auto-schedule spaced revisions.</div>`;
  }
  view('revision').innerHTML = `
    <div class="pl-filters">
      <button class="pl-chip ${REVISION_MODE==='daily'?'on':''}" data-rmode="daily">Daily</button>
      <button class="pl-chip ${REVISION_MODE==='all'?'on':''}" data-rmode="all">All</button>
    </div>
    ${head}
    <button class="btn block" style="margin:2px 0 14px;" onclick="openCustomRevisionModal()">+ Add revision</button>
    <div class="list">${body}</div>`;
  $all('[data-rmode]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{ REVISION_MODE=b.dataset.rmode; renderRevision(); }));
  const tg=$('#rvToggle'); if(tg) tg.addEventListener('click', ()=>{ REVISION_CAL_OPEN=!REVISION_CAL_OPEN; if(REVISION_CAL_OPEN){ const n=new Date(); REVISION_MONTH={y:n.getFullYear(),m:n.getMonth()}; } renderRevision(); });
  $all('[data-rdate]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{ REVISION_DATE=b.dataset.rdate; REVISION_CAL_OPEN=false; renderRevision(); }));
  $all('[data-rmonth]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{
    let {y,m}=REVISION_MONTH; m+=Number(b.dataset.rmonth); if(m<0){m=11;y--;} if(m>11){m=0;y++;}
    REVISION_MONTH={y,m}; renderRevision();
  }));
  $all('[data-revaction]', view('revision')).forEach(b=>b.addEventListener('click', ()=>{
    const id = b.closest('[data-id]').dataset.id;
    const act = b.dataset.revaction;
    if(act==='complete'){ completeRevision(id); renderAll(); toast('Revision marked complete'); }
    else if(act==='edit') openEditRevisionDateModal(id);
    else if(act==='delete') confirmDelete('revision', id, 'Delete this revision entry?');
  }));
}

function subjectStudyTimeBreakdown(){
  const subjects = ['Physics','Chemistry','Mathematics'];
  const mins = subjects.map(s=>allStudy().filter(x=>x.subject===s).reduce((sum,x)=>sum+Number(x.minutes||0),0));
  const generalMin = allStudy().filter(x=>!x.subject).reduce((sum,x)=>sum+Number(x.minutes||0),0);
  const maxMin = Math.max(1, ...mins, generalMin);
  const colors = {Physics:'var(--indigo)', Chemistry:'var(--amber)', Mathematics:'var(--green)'};
  let rows = subjects.map((s,i)=>`<div class="hbar-row"><div class="hb-label">${s}</div><div class="hb-track"><div style="width:${pct(mins[i],maxMin)}%; background:${colors[s]};"></div></div><div class="hb-val">${hoursToHM(mins[i]/60)}</div></div>`).join('');
  if(generalMin>0) rows += `<div class="hbar-row"><div class="hb-label">General</div><div class="hb-track"><div style="width:${pct(generalMin,maxMin)}%; background:var(--slate);"></div></div><div class="hb-val">${hoursToHM(generalMin/60)}</div></div>`;
  return rows || `<p class="muted">No study sessions logged yet.</p>`;
}
function avgSessionLengthMin(){
  if(!allStudy().length) return 0;
  const total = allStudy().reduce((s,x)=>s+Number(x.minutes||0),0);
  return Math.round(total/allStudy().length);
}
function weakChaptersList(){
  const weak = DATA.chapters.filter(c=>c.confidence==='Weak' && c.status!=='Revised');
  if(!weak.length) return emptyState('💪','No weak chapters flagged','Mark low-confidence chapters as "Weak" to see them here.');
  return weak.slice(0,8).map(c=>`<div class="row-item"><div class="ri-main"><div class="ri-title">${esc(c.name)}</div><div class="ri-sub">${esc(c.subject)} · ${esc(c.status)}</div></div><span class="badge weak">Weak</span></div>`).join('');
}
function sumInRangeOffset(fn, days, offset){
  const arr = [];
  for(let i=days-1;i>=0;i--) arr.push(addDays(todayStr(), -(i+offset)));
  return arr.reduce((s,d)=>s+fn(d),0);
}
function avgAccuracyInRange(offset, days){
  const start = addDays(todayStr(), -(offset+days-1));
  const end = addDays(todayStr(), -offset);
  const sessions = DATA.practiceSessions.filter(p=>p.date>=start && p.date<=end);
  const correct = sessions.reduce((s,p)=>s+Number(p.correct||0),0);
  const wrong = sessions.reduce((s,p)=>s+Number(p.wrong||0),0);
  return (correct+wrong) ? pct(correct, correct+wrong) : 0;
}
function compareCard(label, cur, prev, fmt){
  const f = fmt || (v=>v);
  const diff = cur - prev;
  const up = diff > 0, flat = diff===0;
  return `<div class="stat">
    <div class="val">${f(cur)}</div>
    <div class="lbl">${label}</div>
    <div class="cmp-delta" style="font-size:11px; font-weight:700; margin-top:2px; color:${flat?'var(--ink-soft)':(up?'var(--green)':'var(--red)')};">${flat?'No change':(up?'▲ ':'▼ ')+f(Math.abs(diff))+' vs last wk'}</div>
  </div>`;
}
function last8WeeksRevisionRate(){
  const weeks = [];
  for(let w=7; w>=0; w--){
    const start = addDays(todayStr(), -(w*7+6));
    const end = addDays(todayStr(), -(w*7));
    const count = DATA.revisions.filter(r=>r.completed && r.completedDate>=start && r.completedDate<=end).length;
    weeks.push({label:'W'+(8-w), count});
  }
  return weeks;
}

/* ============================================================
   TIMETABLE / TIME BLOCKS
   ============================================================ */
var TT_DATE;            // selected date in the timetable (defaults to today)
var LINKED_BLOCK = null; // {id, date} when the study timer was started from a block
var BLOCK_DAYS = [];
var BLOCK_REPEAT = 'once';
function ttDate(){ return TT_DATE || todayStr(); }
function blockKinds(){ return ['Study','Practice','Revision','Test','Break','Other']; }
function blockColor(kind){
  return ({Study:'var(--indigo)', Practice:'var(--amber)', Revision:'var(--red)', Test:'var(--slate)', Break:'var(--green)', Other:'var(--slate)'})[kind] || 'var(--slate)';
}
function blockHasSubject(kind){ return kind==='Study' || kind==='Practice' || kind==='Revision'; }
function hmToMin(t){ const p = String(t||'0:0').split(':'); return (Number(p[0])||0)*60 + (Number(p[1])||0); }
function minToHM(m){ m = Math.max(0, Math.min(1439, Math.round(m))); return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'); }
function fmtTime12(t){
  const m = hmToMin(t); let h = Math.floor(m/60); const mm = m%60;
  const ap = h>=12 ? 'PM' : 'AM'; h = h%12 || 12;
  return h+':'+String(mm).padStart(2,'0')+' '+ap;
}
function weekdayOf(dateStr){ return new Date(dateStr+'T00:00:00').getDay(); }
function nowMinutes(){ const d = new Date(); return d.getHours()*60 + d.getMinutes(); }
function blockMins(b){ return Math.max(0, hmToMin(b.end) - hmToMin(b.start)); }
function blockTitle(b){ return b.title || b.chapter || b.kind; }
function blockIsDone(b, dateStr){ return (b.doneDates||[]).includes(dateStr); }
function blocksForDate(dateStr){
  const wd = weekdayOf(dateStr);
  return (DATA.timeBlocks||[]).filter(b=>{
    if((b.skipDates||[]).includes(dateStr)) return false;
    if(b.repeat==='days') return dateStr >= (b.from||'0000-00-00') && (b.days||[]).includes(wd);
    return b.date===dateStr;
  }).sort((a,b)=> hmToMin(a.start)-hmToMin(b.start) || hmToMin(a.end)-hmToMin(b.end));
}
function blockStatus(b, dateStr){
  if(blockIsDone(b, dateStr)) return 'done';
  const today = todayStr();
  if(dateStr < today) return 'missed';
  if(dateStr > today) return 'upcoming';
  const now = nowMinutes();
  if(hmToMin(b.end) <= now) return 'missed';
  if(hmToMin(b.start) <= now) return 'now';
  return 'upcoming';
}
function ttDateLabel(dateStr){
  const t = todayStr();
  const d = new Date(dateStr+'T00:00:00');
  const full = d.toLocaleDateString('en-IN', {weekday:'long', day:'numeric', month:'short'});
  let tag = '';
  if(dateStr===t) tag = 'Today';
  else if(dateStr===addDays(t,1)) tag = 'Tomorrow';
  else if(dateStr===addDays(t,-1)) tag = 'Yesterday';
  return {main: tag || full, sub: tag ? full : ''};
}
function ttShift(n){ TT_DATE = addDays(ttDate(), n); renderTimetable(); }
function ttGoToday(){ TT_DATE = todayStr(); renderTimetable(); }

function renderTimetable(){
  const v = view('timetable');
  if(!v) return;
  const date = ttDate(), isToday = date===todayStr();
  const blocks = blocksForDate(date);
  const lab = ttDateLabel(date);
  const countKinds = ['Study','Practice','Revision','Test'];
  const planned = blocks.filter(b=>countKinds.includes(b.kind)).reduce((a,b)=>a+blockMins(b),0);
  const doneMins = blocks.filter(b=>countKinds.includes(b.kind) && blockIsDone(b,date)).reduce((a,b)=>a+blockMins(b),0);
  const doneCount = blocks.filter(b=>blockIsDone(b,date)).length;
  const target = DATA.settings.dailyStudyHours || 0;

  let rows = '';
  let maxEnd = null;
  blocks.forEach(b=>{
    const st = blockStatus(b, date);
    const s0 = hmToMin(b.start), e0 = hmToMin(b.end);
    let overlap = false;
    if(maxEnd!==null){
      const gap = s0 - maxEnd;
      if(gap >= 30) rows += `<div class="tt-gap">Free · ${hoursToHM(gap/60)}</div>`;
      else if(gap < 0) overlap = true;
    }
    maxEnd = maxEnd===null ? e0 : Math.max(maxEnd, e0);
    const done = st==='done';
    const canStart = isToday && !done && (b.kind==='Study' || b.kind==='Practice' || b.kind==='Revision');
    const subBits = [b.kind];
    if(b.subject) subBits.push(b.subject);
    if(b.title && b.chapter) subBits.push(b.chapter);
    subBits.push(hoursToHM(blockMins(b)/60));
    rows += `
    <div class="tt-block ${st}" data-id="${b.id}" style="--kc:${blockColor(b.kind)};">
      <div class="tt-time"><b>${fmtTime12(b.start)}</b><span>${fmtTime12(b.end)}</span></div>
      <div class="tt-card">
        <div class="tt-top">
          <div class="tt-title">${esc(blockTitle(b))}</div>
          <button type="button" class="tt-check ${done?'on':''}" data-ttaction="toggle" aria-label="${done?'Mark not done':'Mark done'}">${ICONS.check}</button>
        </div>
        <div class="tt-sub">${subBits.map(esc).join(' · ')}</div>
        <div class="tt-tags">
          ${st==='now' ? '<span class="badge duetoday">Now</span>' : ''}
          ${st==='missed' ? '<span class="badge overdue">Missed</span>' : ''}
          ${overlap ? '<span class="badge high">Overlaps</span>' : ''}
          ${b.repeat==='days' ? '<span class="badge pending">Repeats</span>' : ''}
          ${canStart ? '<button type="button" class="btn secondary sm" data-ttaction="start" style="padding:4px 10px; font-size:12px; margin-left:auto;">Start timer</button>' : ''}
        </div>
      </div>
    </div>`;
  });

  v.innerHTML = `
    <div class="tt-nav">
      <button type="button" class="icon-btn" onclick="ttShift(-1)" aria-label="Previous day">&lsaquo;</button>
      <div class="tt-date">${esc(lab.main)}${lab.sub ? `<small>${esc(lab.sub)}</small>` : ''}</div>
      <button type="button" class="icon-btn" onclick="ttShift(1)" aria-label="Next day">&rsaquo;</button>
    </div>
    ${isToday ? '' : `<button type="button" class="btn ghost sm block" style="margin-bottom:10px;" onclick="ttGoToday()">Back to today</button>`}
    <button type="button" class="btn block" style="margin-bottom:14px;" onclick="openBlockModal()">+ Add Time Block</button>
    ${blocks.length ? `
    <div class="card" style="margin-bottom:14px;">
      <div class="pbar-row"><span>Blocks done</span><span>${doneCount} / ${blocks.length}</span></div>
      <div class="pbar green"><div style="width:${pct(doneCount, blocks.length)}%"></div></div>
      <p class="muted" style="margin-top:8px; font-size:12px;">Planned study ${hoursToHM(planned/60)}${target ? ' of '+target+'h target' : ''}${doneMins>0 ? ' · done '+hoursToHM(doneMins/60) : ''}</p>
    </div>` : ''}
    <div>
      ${blocks.length ? rows : emptyState('', 'No blocks for this day', 'Plan your day with time blocks. Repeat them on chosen weekdays to build a weekly routine.')}
    </div>
  `;
  $all('.tt-block', v).forEach(el=>{
    const id = el.dataset.id;
    el.querySelector('.tt-card').addEventListener('click', e=>{
      if(e.target.closest('button')) return;
      openBlockModal(id);
    });
    const tg = el.querySelector('[data-ttaction="toggle"]');
    if(tg) tg.addEventListener('click', ()=>toggleBlockDone(id, date));
    const st = el.querySelector('[data-ttaction="start"]');
    if(st) st.addEventListener('click', ()=>startBlock(id, date));
  });
}
function toggleBlockDone(id, date){
  updateData(d=>{
    const b = (d.timeBlocks||[]).find(x=>x.id===id);
    if(!b) return;
    b.doneDates = b.doneDates || [];
    const i = b.doneDates.indexOf(date);
    if(i>-1) b.doneDates.splice(i,1); else b.doneDates.push(date);
  });
  renderAll();
}
function startBlock(id, date){
  const b = (DATA.timeBlocks||[]).find(x=>x.id===id);
  if(!b) return;
  LINKED_BLOCK = {id, date};
  switchView('timer');
  toast('Timer linked to: '+blockTitle(b));

function linkedBlockObj(){
  if(!LINKED_BLOCK) return null;

  const start = b ? b.start : minToHM(Math.min(lastEnd, 22*60));
  const end = b ? b.end : minToHM(Math.min(lastEnd+60, 23*60+59));

const TimerState = {
  mode: 'stopwatch', // stopwatch | pomodoro
  running:false,
  phase:'study', // study | break | longbreak
  pomoCount:0,
  elapsedSec:0, // stopwatch elapsed, or pomodoro elapsed within current phase
  intervalId:null,
  startedAtTotalSec:0, // for pomodoro countdown total
  baseSec:0,           // elapsed seconds when the timer was last started/resumed
  startedAtMs:0,       // wall-clock start of the current run (keeps time right if the phone sleeps)
  lastTickSec:-1,
  lastV:0,
  justFinished:false,
};
const TIMER_R = 104, TIMER_C = 2*Math.PI*TIMER_R;

function renderTimer(){
  const s = DATA.settings;
  const html = `
    ${LINKED_BLOCK ? linkedBlockNoteHtml() : ''}
    <div class="seg" style="max-width:320px; margin:0 auto 6px auto;">
      <button type="button" class="${TimerState.mode==='stopwatch'?'active':''}" onclick="setTimerMode('stopwatch')">Stopwatch</button>
      <button type="button" class="${TimerState.mode==='pomodoro'?'active':''}" onclick="setTimerMode('pomodoro')">Pomodoro</button>
    </div>
    <div class="card" style="max-width:420px; margin:14px auto;">
      <div class="timer-ring ${TimerState.running?'running':(TimerState.elapsedSec>0?'paused':'')} ${TimerState.mode==='pomodoro' && TimerState.phase!=='study'?'brk':''} ${TimerState.justFinished?'done':''}" id="timerRing">
        <div class="timer-glow"></div>
        <svg viewBox="0 0 260 260" aria-hidden="true">
          <defs>
            <linearGradient id="timerGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="currentColor" stop-opacity="1"/>
              <stop offset="100%" stop-color="currentColor" stop-opacity=".55"/>
            </linearGradient>
          </defs>
          ${timerTicksSvg()}
          <circle class="timer-track" cx="130" cy="130" r="${TIMER_R}"/>
          <circle class="timer-prog" id="timerProg" cx="130" cy="130" r="${TIMER_R}" transform="rotate(-90 130 130)" stroke-dasharray="${TIMER_C}" stroke-dashoffset="${TIMER_C}"/>
          <circle class="timer-dot" id="timerDot" cx="130" cy="26" r="7"/>
        </svg>
        <div class="timer-center">
          <div class="timer-digits" id="timerDisplay">${renderTimerText()}</div>
          <div class="timer-mode-label">${TimerState.mode==='pomodoro' ? (TimerState.phase==='study'?'Focus session':(TimerState.phase==='longbreak'?'Long break':'Short break')) : 'Free study session'}${(!TimerState.running && TimerState.elapsedSec>0)?' · Paused':''}</div>
        </div>
      </div>
      <div class="timer-controls">
        ${!TimerState.running ? `<button class="btn" onclick="startTimer()">${TimerState.elapsedSec>0?'Resume':'Start'}</button>` : `<button class="btn secondary" onclick="pauseTimer()">Pause</button>`}
        <button class="btn danger" onclick="stopTimer()">Stop &amp; Save</button>
        <button class="btn ghost" onclick="resetTimer()">Reset</button>
      </div>
      ${TimerState.mode==='pomodoro' ? `<p class="muted" style="text-align:center; margin-top:14px;">Round ${TimerState.pomoCount+1} · ${s.pomodoroMinutes}m focus / ${s.pomodoroBreak}m break</p>` : ''}
    </div>

    <button class="btn secondary block" style="margin-bottom:6px;" onclick="openManualSessionModal()">+ Log Study Session Manually</button>
    <p class="muted" style="text-align:center; margin-bottom:18px;">Already studied offline? Add the time directly without the timer.</p>

    <div class="section-title">Recent study sessions</div>
    <div class="list">
      ${DATA.studySessions.slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10).map(sessionRowHtml).join('') || emptyState('⏱️','No sessions logged yet','Start a timer or log one manually.')}
    </div>
  `;
  view('timer').innerHTML = html;
  TimerState.justFinished = false;
  TimerState.lastTickSec = -1;
  updateTimerVisual();
  $all('[data-sessaction="delete"]', view('timer')).forEach(b=>b.addEventListener('click', ()=>{
    const id = b.closest('[data-id]').dataset.id;
    confirmDelete('studySession', id, 'Delete this study session?');
  }));
}
function sessionRowHtml(s){
  const timeRange = (s.startTime && s.endTime) ? ` · ${s.startTime}–${s.endTime}` : '';
  return `<div class="row-item" data-id="${s.id}"><div class="ri-main">
    <div class="ri-title">${esc(s.subject||'Study')}${s.chapter?' · '+esc(s.chapter):''}</div>
    <div class="ri-sub">${fmtDateShort(s.date)} · ${Math.round(s.minutes)} min${timeRange}</div>
  </div>
  <div class="ri-actions"><button class="icon-btn" data-sessaction="delete">${ICONS.trash}</button></div>
  </div>`;
}

function setTimerMode(mode){
  if(TimerState.running) return toast('Stop the current session first');
  TimerState.mode = mode;
  TimerState.phase = 'study';
  TimerState.pomoCount = 0;
  TimerState.elapsedSec = 0;
  renderTimer();
}
function currentPhaseTotalSec(){
  const s = DATA.settings;
  if(TimerState.phase==='study') return s.pomodoroMinutes*60;
  if(TimerState.phase==='longbreak') return s.pomodoroLongBreak*60;
  return s.pomodoroBreak*60;
}
function renderTimerText(){
  if(TimerState.mode==='stopwatch') return secToClock(TimerState.elapsedSec);
  const remaining = Math.max(0, currentPhaseTotalSec() - TimerState.elapsedSec);
  return secToClock(remaining);
}
function timerTicksSvg(){
  let out = '';
  for(let i=0;i<60;i++){
    const a = i*Math.PI/30, sn = Math.sin(a), cs = Math.cos(a);
    const r1 = (i%5===0) ? 117 : 120, r2 = 127;
    out += `<line class="timer-tick" data-i="${i}" x1="${(130+r1*sn).toFixed(2)}" y1="${(130-r1*cs).toFixed(2)}" x2="${(130+r2*sn).toFixed(2)}" y2="${(130-r2*cs).toFixed(2)}"/>`;
  }
  return out;
}
/* Recomputes elapsed seconds from the wall clock so the timer stays right even if the tab was throttled. */
function syncTimerElapsed(){
  if(TimerState.running) TimerState.elapsedSec = TimerState.baseSec + Math.floor((Date.now()-TimerState.startedAtMs)/1000);
}
function updateTimerVisual(){
  const disp = $('#timerDisplay');
  if(!disp) return;
  const txt = renderTimerText();
  disp.textContent = txt;
  disp.classList.toggle('long', txt.length>5);
  // ring: pomodoro drains as the phase runs out, stopwatch sweeps once every minute
  const preciseSec = TimerState.running ? TimerState.baseSec + (Date.now()-TimerState.startedAtMs)/1000 : TimerState.elapsedSec;
  let v;
  if(TimerState.mode==='pomodoro') v = Math.max(0, 1 - preciseSec/currentPhaseTotalSec());
  else v = (preciseSec % 60)/60;
  const prog = $('#timerProg'), dot = $('#timerDot');
  if(prog){
    if(v < TimerState.lastV - 0.5){ prog.style.transition='none'; prog.getBoundingClientRect(); prog.style.transition=''; }  // no backwards sweep at the wrap
    prog.style.strokeDashoffset = TIMER_C*(1-v); prog.style.opacity = v<0.002 ? 0 : '';
  }
  TimerState.lastV = v;
  if(dot){
    const a = v*2*Math.PI;
    dot.setAttribute('cx', (130+TIMER_R*Math.sin(a)).toFixed(2));
    dot.setAttribute('cy', (130-TIMER_R*Math.cos(a)).toFixed(2));
    dot.style.opacity = (v<0.002 && TimerState.elapsedSec===0) ? 0.0 : 1;
  }
  // outer second ticks
  const sec = TimerState.elapsedSec % 60;
  if(sec !== TimerState.lastTickSec){
    TimerState.lastTickSec = sec;
    $all('.timer-tick').forEach((t,i)=>{
      t.classList.toggle('on', i<sec);
      t.classList.toggle('now', i===sec && TimerState.running);
    });
  }
}
function startTimer(){
  if(TimerState.running) return;
  TimerState.running = true;
  TimerState.baseSec = TimerState.elapsedSec;
  TimerState.startedAtMs = Date.now();
  TimerState.intervalId = setInterval(()=>{
    syncTimerElapsed();
    if(TimerState.mode==='pomodoro' && TimerState.elapsedSec >= currentPhaseTotalSec()){
      handlePomodoroPhaseEnd();
      return;
    }
    updateTimerVisual();
  },250);
  renderTimer();
}
function pauseTimer(){
  syncTimerElapsed();
  TimerState.running = false;
  clearInterval(TimerState.intervalId);
  renderTimer();
}
function handlePomodoroPhaseEnd(){
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  TimerState.justFinished = true;
  if(TimerState.phase==='study'){
    logStudyMinutesPrompt(DATA.settings.pomodoroMinutes);
    TimerState.pomoCount += 1;
    TimerState.phase = (TimerState.pomoCount % 4 === 0) ? 'longbreak' : 'break';
  } else {
    TimerState.phase = 'study';
  }
  TimerState.elapsedSec = 0;
  toast(TimerState.phase==='study' ? 'Break over — back to focus!' : 'Focus session complete — take a break');
  renderTimer();
}
function stopTimer(){
  syncTimerElapsed();
  if(TimerState.elapsedSec < 1){ resetTimer(); return; }
  const minutes = TimerState.mode==='stopwatch' ? TimerState.elapsedSec/60 : Math.min(TimerState.elapsedSec, currentPhaseTotalSec())/60;
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  if(TimerState.mode==='pomodoro' && TimerState.phase!=='study'){
    // break session, don't log study time
    resetTimer();
    return;
  }
  logStudyMinutesPrompt(minutes);
  resetTimer();
}
function resetTimer(){
  clearInterval(TimerState.intervalId);
  TimerState.running = false;
  TimerState.elapsedSec = 0;
  TimerState.baseSec = 0;
  TimerState.phase = 'study';
  TimerState.pomoCount = 0;
  renderTimer();
}

function profileOverallHtml(){
  const T=DATA.tests, rec=computeRecords(), rd=readinessScore();
  const key={Physics:'physics',Chemistry:'chemistry',Mathematics:'maths'};
  const vals=(sub)=>T.map(t=>t[key[sub]]).filter(v=>v!=null&&v!=='').map(Number);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  const mx=a=>a.length?Math.max(...a):null;
  const fmt=v=>v==null?'—':v;
  const tile=(l,v,sub)=>`<div class="pf-box"><div class="l">${l}</div><div class="n">${v}</div>${sub?`<div class="l" style="margin:4px 0 0">${sub}</div>`:''}</div>`;
  const grp=(t,items,c)=>`<div class="pf-lbl">${t}</div><div class="pf-row" style="grid-template-columns:1fr 1fr;flex-wrap:wrap">${items.map(x=>x.replace('class="pf-box"','class="pf-box '+c+'"')).join('')}</div>`;
  const tot=T.map(t=>Number(t.total||0));
  const spanDays=(arr)=>{ const ds=arr.map(x=>x.date).filter(Boolean).sort(); return ds.length ? Math.max(1,Math.round((new Date(todayStr())-new Date(ds[0]))/864e5)+1) : 0; };
  const PS=DATA.practiceSessions, SS=allStudy();
  const totQ=PS.reduce((a,x)=>a+Number(x.attempted||0),0);
  const totMin=SS.reduce((a,x)=>a+Number(x.minutes||0),0);
  const qDays=spanDays(PS), sDays=spanDays(SS);
  const corr=PS.reduce((a,x)=>a+Number(x.correct||0),0), wr=PS.reduce((a,x)=>a+Number(x.wrong||0),0);
  const doneCh=DATA.chapters.filter(c=>c.status==='Completed'||c.status==='Revised').length;
  const rc=rd.score>=70?'var(--green)':rd.score>=40?'var(--amber)':'var(--red)';
  const best=[
    tile('Best study day',hoursToHM(rec.bestDayHours),rec.bestDayDate?fmtDateShort(rec.bestDayDate):''),
    tile('Best questions day',rec.bestQ,rec.bestQDate?fmtDateShort(rec.bestQDate):''),
    tile('Best mock score',fmt(rec.bestScore),'Mock test'),
    ...Object.keys(key).map(n=>tile('Best '+n,fmt(mx(vals(n))),'Mock test marks'))
  ];
  if(rec.bestJump!=null) best.push(tile('Best mock jump',(rec.bestJump>=0?'+':'')+rec.bestJump,'Mock test'));
  const average=[
    tile('Average mock score',fmt(avg(tot)),'Mock test'),
    ...Object.keys(key).map(n=>tile('Average '+n,fmt(avg(vals(n))),'Mock test marks')),
    tile('Avg questions / day',qDays?Math.round(totQ/qDays):'—','Since first practice'),
    tile('Avg study / day',sDays?hoursToHM(totMin/60/sDays):'—','Since first session'),
    tile('Avg practice accuracy',(corr+wr)?Math.round(corr/(corr+wr)*100)+'%':'—','All practice'),
    tile('Avg questions / session',PS.length?Math.round(totQ/PS.length):'—',''),
    tile('Avg time / question',formatSeconds(avgTimePerQuestion()),''),
    tile('Avg session length',avgSessionLengthMin()+'m','')
  ];
  const total=[
    tile('Total study time',hoursToHM(allStudy().reduce((a,x)=>a+Number(x.minutes||0),0)/60),''),
    tile('Total questions',DATA.practiceSessions.reduce((a,x)=>a+Number(x.attempted||0),0),''),
    tile('Total tests',T.length,''),
    tile('Chapters completed',doneCh,'of '+DATA.chapters.length)
  ];
  const prog=['Physics','Chemistry','Mathematics'].map(n=>[n,chapterCompletionPct(n),'var(--green)']).concat([['Important',importantSyllabusPct(),'var(--amber)']]);
  return `<div class="pf-lbl">Readiness</div>
    <div class="pf-box" style="display:flex;align-items:center;gap:16px"><div class="n" style="color:${rc};font-size:40px">${rd.score}</div><div style="flex:1"><div class="l">Out of 100</div><div class="pbar" style="margin-top:6px"><div style="width:${rd.score}%;background:${rc}"></div></div></div></div>
    ${grp('Best',best,'pf-c-g')}${grp('Average',average,'pf-c-i')}${grp('Total',total,'pf-c-a')}
    <div class="pf-lbl">Chapter completion</div>
    <div class="pf-box">${prog.map(x=>`<div class="hbar-row"><div class="hb-label">${x[0]}</div><div class="hb-track"><div style="width:${x[1]}%;background:${x[2]}"></div></div><div class="hb-val">${x[1]}%</div></div>`).join('')}</div>
    <div class="pf-lbl">Weak chapters</div>
    <div class="list">${weakChaptersList()}</div>`;
}
function renderProfile(){
  const s=DATA.settings, st=DATA.streaks.study;
  const m=Math.max(daysUntil(s.jeeMainDate),0), a=Math.max(daysUntil(s.jeeAdvancedDate),0);
  $('#view-profile').innerHTML=`
    <div class="pf-top">
      <div class="pf-avatar">${avatarInner()}</div>
      <div class="pf-name">${esc(profileName())}</div>
      <div class="pf-sub">${esc((fbUser&&fbUser.email)||s.targetExam||'')}</div>
      <button class="pf-edit" onclick="openProfileEdit()">Edit profile</button>
    </div>
    <div class="hx-row">
      <div class="hx-cd" style="background:#3B82D6"><div class="hx-cd-top"><span>JEE Main</span></div><div class="hx-num">${m}<span> days left</span></div><div class="hx-date">${esc(fmtDate(s.jeeMainDate)||'')}</div></div>
      <div class="hx-cd" style="background:#F29A38"><div class="hx-cd-top"><span>JEE Advanced</span></div><div class="hx-num">${a}<span> days left</span></div><div class="hx-date">${esc(fmtDate(s.jeeAdvancedDate)||'')}</div></div>
    </div>
    <div class="hx-row">
      <div class="hx-card pf-tap" style="margin:0" onclick="openStreakDetails('current')"><div class="hx-k">Current streak</div><div class="hx-big2">${st.current}<span> days</span></div></div>
      <div class="hx-card pf-tap" style="margin:0" onclick="openStreakDetails('best')"><div class="hx-k">Best streak</div><div class="hx-big2">${st.longest}<span> days</span></div></div>
    </div>
    ${profileOverallHtml()}
    ${fbUser ? '<button class="btn secondary block" style="margin-top:26px;color:var(--red)" onclick="logout()">Log out</button>' : ''}`;
  updateAvatarBtn();
}
function openProfileEdit(){
  let photo; // undefined = unchanged, '' = removed, string = new svg
  const ph=()=>{ const sv = photo===undefined ? DATA.settings.photoSvg : photo; return sv ? `<img alt="" src="${svgSrc(sv)}">` : esc((($('#pf-name')&&$('#pf-name').value.trim()||profileName())[0]||'S').toUpperCase()); };
  openModal(`
    <div class="modal-head"><h3>Edit profile</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <div class="pf-ph" id="pf-prev">${ph()}</div>
    <div style="display:flex;gap:8px;justify-content:center;margin-bottom:16px">
      <label class="btn secondary sm" style="cursor:pointer">Change photo<input type="file" id="pf-file" accept="image/*" hidden></label>
      <button class="btn secondary sm" id="pf-rm" type="button">Remove</button>
    </div>
    <div class="field"><label>Name</label><input id="pf-name" value="${esc(DATA.settings.studentName||'')}" placeholder="Your name" maxlength="40"></div>
    <div class="modal-actions"><button class="btn" id="pf-save" type="button">Save</button></div>`);
  $('#pf-file').addEventListener('change',e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{ const im=new Image(); im.onload=()=>{
      const N=192, c=document.createElement('canvas'); c.width=c.height=N;
      const z=Math.min(im.width,im.height), sx=(im.width-z)/2, sy=(im.height-z)/2;
      c.getContext('2d').drawImage(im,sx,sy,z,z,0,0,N,N);
      photo=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${N} ${N}"><image href="${c.toDataURL('image/jpeg',0.82)}" width="${N}" height="${N}"/></svg>`;
      $('#pf-prev').innerHTML=ph();
    }; im.src=r.result; };
    r.readAsDataURL(f);
  });
  $('#pf-rm').addEventListener('click',()=>{ photo=''; $('#pf-prev').innerHTML=ph(); });
  $('#pf-save').addEventListener('click',()=>{
    const nm=$('#pf-name').value.trim();
    updateData(d=>{ d.settings.studentName=nm; if(photo!==undefined) d.settings.photoSvg=photo; });
    closeModal(); renderAll(); toast('Profile updated');
  });
}

function renderMore(){
  const ICO = moreIco();
  const od = dueNowChapters().length;
  const items = [
    ['analytics','Analytics',ICONS.analytics],['timetable','Timetable',ICONS.clock],['goal','My Goal',ICONS.goal],['practice','Practice',ICONS.practice],
    ['revision','Revision',ICONS.revision],['timer','Study Timer',ICONS.timer],
    ['chapters','Chapters',ICONS.chapters],['tests','Tests',ICONS.tests],
    ['deadlines','Deadlines',ICO.deadline,od]
  ];
  if(DEFERRED_INSTALL_PROMPT) items.push(['install','Install App',ICO.install]);
  items.push(['share','Share Progress',ICO.share]);
  $('#view-more').innerHTML = '<div class="more-grid">' + items.map(i=>`<button class="more-box" data-more="${i[0]}">${i[2]}<span>${i[1]}</span>${i[3]?`<span class="mb-badge">${i[3]}</span>`:''}</button>`).join('') + '</div>';
  $all('[data-more]', $('#view-more')).forEach(b=>b.addEventListener('click', async ()=>{
    const k=b.dataset.more;
    if(k==='share') openShareCardModal();
    else if(k==='deadlines') openDeadlinePanel();
    else if(k==='install'){ if(!DEFERRED_INSTALL_PROMPT) return; DEFERRED_INSTALL_PROMPT.prompt(); await DEFERRED_INSTALL_PROMPT.userChoice; DEFERRED_INSTALL_PROMPT=null; renderMore(); }
    else switchView(k);
  }));
}

var AN_TAB='week';
function moreIco(){ return {"share": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"18\" cy=\"5\" r=\"2.5\"/><circle cx=\"6\" cy=\"12\" r=\"2.5\"/><circle cx=\"18\" cy=\"19\" r=\"2.5\"/><path d=\"m8.2 10.8 7.6-4.6M8.2 13.2l7.6 4.6\"/></svg>", "deadline": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"3.5\" y=\"5\" width=\"17\" height=\"15.5\" rx=\"2.5\"/><path d=\"M8 3v4M16 3v4M3.5 10h17\"/></svg>", "install": "<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 4v11M7.5 10.5 12 15l4.5-4.5M5 19.5h14\"/></svg>"}; }
/* ---------- Quick actions grid (2 rows, >=3 cols, square tiles, customisable) ---------- */
function qaPool(){
  const I=moreIco();
  return [
    {id:'session',label:'Start Session',ic:ICONS.timer,run:()=>handleQuickAction('session')},
    {id:'task',label:'Add Task',ic:ICONS.add_task,run:()=>handleQuickAction('task')},
    {id:'questions',label:'Add Questions',ic:ICONS.practice,run:()=>handleQuickAction('practice')},
    {id:'test',label:'Add Test',ic:ICONS.tests,run:()=>handleQuickAction('test')},
    {id:'markrev',label:'Mark Revision',ic:ICONS.revision,run:()=>handleQuickAction('revision')},
    {id:'timetable',label:'Timetable',ic:ICONS.clock,run:()=>switchView('timetable')},
    {id:'planner',label:'Planner',ic:ICONS.planner,run:()=>switchView('planner')},
    {id:'chapters',label:'Chapters',ic:ICONS.chapters,run:()=>switchView('chapters')},
    {id:'goal',label:'My Goal',ic:ICONS.goal,run:()=>switchView('goal')},
    {id:'practice',label:'Practice',ic:ICONS.practice,run:()=>switchView('practice')},
    {id:'revision',label:'Revision',ic:ICONS.revision,run:()=>switchView('revision')},
    {id:'deadlines',label:'Deadlines',ic:I.deadline,run:()=>openDeadlinePanel()},
    {id:'analytics',label:'Analytics',ic:ICONS.analytics,run:()=>switchView('analytics')},
    {id:'share',label:'Share',ic:I.share,run:()=>openShareCardModal()}
  ];
}
function qaIds(){
  const pool=qaPool().map(x=>x.id), saved=DATA.settings.qaList;
  const ids=Array.isArray(saved)?saved.filter(i=>pool.includes(i)):[];
  return ids.length ? ids : pool;
}
function qaCols(){
  const el=$('#qaGrid'); const w=(el&&el.clientWidth)||(view('home').clientWidth)||360;
  return Math.min(6, Math.max(3, Math.floor((w+10)/(88+10))));
}
function renderQuickGrid(){
  const g=$('#qaGrid'); if(!g) return;
  const cols=qaCols(), pool=qaPool();
  const items=qaIds().map(id=>pool.find(x=>x.id===id)).slice(0,cols*2);
  g.style.setProperty('--cols',cols);
  g.innerHTML=items.map(x=>`<button class="qa-tile" data-qid="${x.id}">${x.ic}<span>${x.label}</span></button>`).join('');
  $all('.qa-tile',g).forEach(b=>b.addEventListener('click',()=>pool.find(x=>x.id===b.dataset.qid).run()));
}
let _qaRz; window.addEventListener('resize',()=>{ clearTimeout(_qaRz); _qaRz=setTimeout(()=>{ if(CURRENT_VIEW==='home') renderQuickGrid(); },120); });
function openQaCustomise(){
  const pool=qaPool(), on=qaIds();
  let list=on.concat(pool.map(x=>x.id).filter(i=>!on.includes(i))), sel=new Set(on);
  const draw=()=>{
    $('#qaList').innerHTML=list.map((id,i)=>{ const x=pool.find(p=>p.id===id); return `<div class="qa-row2">
      <label><input type="checkbox" data-c="${id}" ${sel.has(id)?'checked':''}><span class="qa-ico">${x.ic}</span>${x.label}</label>
      <span><button type="button" class="qa-mv" data-u="${i}" aria-label="Up">&#9650;</button><button type="button" class="qa-mv" data-d="${i}" aria-label="Down">&#9660;</button></span></div>`; }).join('');
    $all('[data-c]',$('#qaList')).forEach(c=>c.addEventListener('change',()=>{ c.checked?sel.add(c.dataset.c):sel.delete(c.dataset.c); }));
    $all('[data-u]',$('#qaList')).forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.u; if(i>0){ [list[i-1],list[i]]=[list[i],list[i-1]]; draw(); } }));
    $all('[data-d]',$('#qaList')).forEach(b=>b.addEventListener('click',()=>{ const i=+b.dataset.d; if(i<list.length-1){ [list[i+1],list[i]]=[list[i],list[i+1]]; draw(); } }));
  };
  openModal(`<div class="modal-head"><h3>Quick actions</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    <p class="muted" style="margin-bottom:12px">Tick the ones you want and set the order. Each screen shows as many as fit in 2 rows, from the top.</p>
    <div id="qaList"></div>
    <div class="modal-actions"><button class="btn secondary" id="qaReset" type="button">Reset</button><button class="btn" id="qaSave" type="button">Save</button></div>`);
  draw();
  $('#qaReset').addEventListener('click',()=>{ updateData(d=>{ d.settings.qaList=null; }); closeModal(); renderQuickGrid(); });
  $('#qaSave').addEventListener('click',()=>{ const out=list.filter(i=>sel.has(i)); updateData(d=>{ d.settings.qaList=out.length?out:null; }); closeModal(); renderQuickGrid(); });
}
</script>
