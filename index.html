<style>
:root{
  box-sizing:border-box;
  --paper:#FAF9F6;
  --paper-2:#F1EFE9;
  --ink:#1B2233;
  --ink-soft:#5B6178;
  --line:#E4E1D8;
  --indigo:#33409E;
  --indigo-deep:#242C74;
  --indigo-tint:#EBEDFA;
  --amber:#DD9A2E;
  --amber-tint:#FBF0DC;
  --green:#2F9E63;
  --green-tint:#E4F6EC;
  --red:#D14B4B;
  --red-tint:#FCE9E9;
  --slate:#8B90A3;
  --card:#FFFFFF;
  --radius-sm:10px;
  --radius-md:16px;
  --radius-lg:22px;
  --shadow:0 1px 2px rgba(27,34,51,.04), 0 6px 20px rgba(27,34,51,.06);
  --font-head:'Lexend',system-ui,sans-serif;
  --font-body:'Inter',system-ui,sans-serif;
  --font-mono:'JetBrains Mono',monospace;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --paper:#12141C;
  --paper-2:#181B26;
  --ink:#EDEFF7;
  --ink-soft:#9BA0B4;
  --line:#2A2E3E;
  --indigo:#6C7BE8;
  --indigo-deep:#8993EF;
  --indigo-tint:#1D2247;
  --amber:#E8AE4D;
  --amber-tint:#332714;
  --green:#4FBE8A;
  --green-tint:#12291E;
  --red:#E1706F;
  --red-tint:#33191A;
  --slate:#767C93;
  --card:#1B1E2A;
  --shadow:0 1px 2px rgba(0,0,0,.2), 0 8px 24px rgba(0,0,0,.35);
}
button{color:inherit;}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
body{
  margin:0;
  height:100%;
  background:var(--paper);
  color:var(--ink);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  transition:background .25s ease, color .25s ease;
}
h1,h2,h3,h4{font-family:var(--font-head); margin:0; color:var(--ink); letter-spacing:-0.01em;}
p{margin:0}
button{font-family:inherit}
input,select,textarea{font-family:inherit}
a{color:inherit}
::selection{background:var(--indigo); color:#fff;}

.app{
  display:flex;
  min-height:100%;
}

/* ---------- Sidebar (desktop) ---------- */
.sidebar{
  width:236px;
  flex-shrink:0;
  background:var(--paper-2);
  border-right:1px solid var(--line);
  padding:24px 14px;
  display:none;
  flex-direction:column;
  gap:4px;
  position:sticky;
  top:0;
  height:100vh;
}
.brand{
  display:flex;
  align-items:baseline;
  gap:8px;
  padding:6px 12px 22px 12px;
}
.brand-mark{
  font-family:var(--font-head);
  font-weight:700;
  font-size:18px;
  color:var(--indigo);
}
.brand-sub{font-size:11px; color:var(--ink-soft); font-weight:600;}
.nav-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:11px 14px;
  border-radius:12px;
  color:var(--ink-soft);
  font-weight:600;
  font-size:14px;
  cursor:pointer;
  border:none;
  background:none;
  text-align:left;
  width:100%;
}
.nav-item svg{width:19px; height:19px; flex-shrink:0;}
.nav-item:hover{background:var(--indigo-tint); color:var(--indigo);}
.nav-item.active{background:var(--indigo); color:#fff;}
.sidebar-foot{margin-top:auto; padding:12px; font-size:12px; color:var(--slate);}

/* ---------- Main ---------- */
.main{
  flex:1;
  min-width:0;
  padding:18px 16px 96px 16px;
}
.topbar{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:18px;
}
.topbar h1{font-size:24px; font-weight:700;}
.topbar .date-pill{
  font-size:12px; color:var(--ink-soft); font-weight:600;
  background:var(--paper-2); padding:6px 12px; border-radius:20px; border:1px solid var(--line);
}

.streak-chips{display:flex; gap:6px; align-items:center;}
.streak-chip{
  display:inline-flex; align-items:center; gap:6px; padding:3px 11px 3px 3px; border-radius:999px;
  background:var(--paper-2); border:1px solid var(--line); color:var(--ink);
  font-family:var(--font-head); font-weight:600; font-size:14px; line-height:1;
}
button.streak-chip{cursor:pointer;}
button.streak-chip:active{transform:scale(.97);}
button.streak-chip:focus-visible{outline:2px solid var(--indigo); outline-offset:2px;}
.sc-ico{width:26px; height:26px; border-radius:50%; display:inline-flex; align-items:center; justify-content:center; flex-shrink:0;}
.sc-ico{font-size:14px; line-height:1;}
.sc-ico.fire{background:var(--amber-tint); color:var(--amber);}
.sc-ico.trophy{background:var(--indigo-tint); color:var(--indigo);}
.bs-count{font-family:var(--font-head); font-size:40px; font-weight:700; color:var(--indigo); line-height:1.1;}
.bs-range{margin-top:10px; font-size:14px; line-height:1.5;}
.view{display:none;}
.view.active{display:block; animation:fadein .28s ease;}
@keyframes fadein{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);}}
@media (prefers-reduced-motion:reduce){.view.active{animation:none} *{transition:none !important}}

/* ---------- Cards & Grid ---------- */
.grid{display:grid; gap:12px;}
.grid-2{grid-template-columns:repeat(2,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
@media (max-width:640px){
  .grid-3{grid-template-columns:repeat(2,1fr);}
  .grid-4{grid-template-columns:repeat(2,1fr);}
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
  box-shadow:var(--shadow);
}
.card-flat{
  background:var(--paper-2);
  border:1px solid var(--line);
  border-radius:var(--radius-md);
  padding:16px;
}
.section-title{
  font-size:16px; font-weight:700; margin:26px 0 10px 0; color:var(--ink);
  display:flex; align-items:center; justify-content:space-between;
}
.section-title:first-child{margin-top:0;}
.muted{color:var(--ink-soft); font-size:12px;}

/* ---------- Hero countdown ---------- */
.hero{
  background:linear-gradient(135deg, var(--indigo-deep), var(--indigo));
  border-radius:var(--radius-lg);
  padding:22px;
  color:#fff;
  position:relative;
  overflow:hidden;
}
.hero-row{display:flex; gap:14px; flex-wrap:wrap;}
.hero-exam{flex:1; min-width:130px;}
.hero-exam .label{font-size:12px; opacity:.75; font-weight:600; text-transform:none;}
.hero-exam .num{font-family:var(--font-head); font-size:40px; font-weight:700; line-height:1.05; margin-top:2px;}
.hero-exam .num span{font-size:16px; font-weight:600; opacity:.8;}
.hero-exam .sub{font-size:12px; opacity:.7; margin-top:2px;}
.hero-divider{width:1px; background:rgba(255,255,255,.2); align-self:stretch;}

/* ---------- Stat tiles ---------- */
.stat{
  background:var(--card); border:1px solid var(--line); border-radius:var(--radius-md);
  padding:14px; display:flex; flex-direction:column; gap:6px;
}
.stat .icon{width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center; margin-bottom:2px;}
.stat .icon svg{width:16px; height:16px;}
.stat .val{font-family:var(--font-head); font-size:24px; font-weight:700;}
.stat .lbl{font-size:12px; color:var(--ink-soft); font-weight:600;}

/* progress bars */
.pbar{height:8px; border-radius:6px; background:var(--paper-2); overflow:hidden; margin-top:8px;}
.pbar > div{height:100%; border-radius:6px; background:var(--indigo); transition:width .4s ease;}
.pbar.amber > div{background:var(--amber);}
.pbar.green > div{background:var(--green);}
.pbar-row{display:flex; justify-content:space-between; font-size:12px; color:var(--ink-soft); margin-bottom:2px;}

/* quick actions */
.qa-row{display:flex; gap:10px; overflow-x:auto; padding-bottom:4px; -webkit-overflow-scrolling:touch;}
.qa-btn{
  flex:0 0 auto; display:flex; flex-direction:column; align-items:center; gap:6px;
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:12px 16px;
  cursor:pointer; min-width:84px; font-size:12px; font-weight:600; color:var(--ink);
}
.qa-btn .qico{width:34px; height:34px; border-radius:10px; background:var(--indigo-tint); color:var(--indigo); display:flex; align-items:center; justify-content:center;}
.qa-btn .qico svg{width:17px; height:17px;}
.qa-btn:active{transform:scale(.96);}

/* buttons */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:7px;
  padding:11px 18px; border-radius:12px; border:none; font-weight:600; font-size:14px;
  cursor:pointer; background:var(--indigo); color:#fff;
}
.btn:active{transform:scale(.98);}
.btn.secondary{background:var(--paper-2); color:var(--ink); border:1px solid var(--line);}
.btn.danger{background:var(--red);}
.btn.ghost{background:transparent; color:var(--indigo); padding:8px 10px;}
.btn.block{width:100%;}
.btn.sm{padding:7px 12px; font-size:12px; border-radius:9px;}
.fab{
  position:fixed; right:18px; bottom:86px; z-index:40;
  width:56px; height:56px; border-radius:50%; background:var(--indigo); color:#fff;
  display:flex; align-items:center; justify-content:center; border:none; box-shadow:0 8px 20px rgba(51,64,158,.35);
  cursor:pointer;
}
.fab svg{width:24px; height:24px;}
@media (min-width:900px){.fab{bottom:28px;}}
.fab-alert{
  bottom:154px; width:44px; height:44px; background:var(--red);
  box-shadow:0 8px 20px rgba(209,75,75,.4); font-weight:700; font-size:16px;
}
@media (min-width:900px){.fab-alert{bottom:96px;}}

/* forms */
.field{margin-bottom:13px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:5px;}
.field input, .field select, .field textarea{
  width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
  background:var(--paper); color:var(--ink); font-size:14px;
}
.field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--indigo); outline-offset:1px;}
.field-row{display:flex; gap:10px;}
.field-row > .field{flex:1;}
.seg{display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden;}
.seg button{flex:1; padding:9px 6px; background:var(--paper); border:none; font-size:12px; font-weight:600; color:var(--ink-soft); cursor:pointer; border-right:1px solid var(--line);}
.seg button:last-child{border-right:none;}
.seg button.active{background:var(--indigo); color:#fff;}

/* list rows */
.list{display:flex; flex-direction:column; gap:8px;}
.row-item{
  background:var(--card); border:1px solid var(--line); border-radius:14px; padding:13px 14px;
  display:flex; align-items:center; gap:12px;
}
.row-item .ri-main{flex:1; min-width:0;}
.row-item .ri-title{font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px;}
.row-item .ri-sub{font-size:12px; color:var(--ink-soft); margin-top:2px;}
.row-item .ri-actions{display:flex; gap:6px; flex-shrink:0;}
.icon-btn{
  width:32px; height:32px; border-radius:9px; border:1px solid var(--line); background:var(--paper);
  display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ink-soft);
}
.icon-btn svg{width:15px; height:15px;}
.icon-btn:hover{color:var(--indigo); border-color:var(--indigo);}

.badge{
  font-size:11px; font-weight:700; padding:3px 8px; border-radius:20px; white-space:nowrap;
}
.badge.high{background:var(--red-tint); color:var(--red);}
.badge.medium{background:var(--amber-tint); color:var(--amber);}
.badge.low{background:var(--green-tint); color:var(--green);}
.badge.done{background:var(--green-tint); color:var(--green);}
.badge.pending{background:var(--paper-2); color:var(--ink-soft);}
.badge.studying{background:var(--indigo-tint); color:var(--indigo);}
.badge.notstarted{background:var(--paper-2); color:var(--slate);}
.badge.revised{background:var(--amber-tint); color:var(--amber);}
.badge.overdue{background:var(--red-tint); color:var(--red);}
.badge.weak{background:var(--red-tint); color:var(--red);}
.badge.duetoday{background:var(--amber-tint); color:var(--amber);}
.badge.upcoming{background:var(--indigo-tint); color:var(--indigo);}
.badge.weak{background:var(--red-tint); color:var(--red);}
.badge.average{background:var(--amber-tint); color:var(--amber);}
.badge.strong{background:var(--green-tint); color:var(--green);}

.checkline{display:flex; align-items:center; gap:8px; font-size:14px; color:var(--ink-soft);}
.checkline input{width:16px; height:16px;}

/* tabs (subject/section tabs) */
.tabs{display:flex; gap:6px; overflow-x:auto; margin-bottom:14px; -webkit-overflow-scrolling:touch;}

.cal-header{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px;}
.readiness-num{font-size:40px; font-weight:700; line-height:1;}
.cal-title{font-weight:700; font-size:16px;}
.cal-weekdays{display:grid; grid-template-columns:repeat(7,1fr); text-align:center; font-size:11px; color:var(--ink-soft); font-weight:600; margin-bottom:4px;}
.cal-grid{display:grid; grid-template-columns:repeat(7,1fr); gap:4px;}
.cal-cell{aspect-ratio:1; border-radius:10px; border:1px solid var(--line); background:var(--card); padding:4px; display:flex; flex-direction:column; cursor:pointer; overflow:hidden;}
.cal-cell.cal-empty{border:none; background:transparent; cursor:default;}
.cal-cell.cal-today{border-color:var(--indigo); border-width:2px;}
.cal-cell.cal-future{opacity:0.45; cursor:default;}
.cal-cell.cal-lv0{background:var(--paper-2);}
.cal-cell.cal-lv1{background:var(--indigo-tint);}
.cal-cell.cal-lv2{background:#B9C7F2;}
.cal-cell.cal-lv3{background:#7C93E0;}
.cal-cell.cal-lv4{background:var(--indigo); border-color:var(--indigo);}
.cal-cell.cal-lv3 .cal-daynum, .cal-cell.cal-lv4 .cal-daynum{color:#fff;}
.cal-daynum{font-size:12px; font-weight:700; color:var(--ink);}
.cal-dots{display:flex; flex-wrap:wrap; gap:2px; margin-top:auto;}
.cal-dot{width:6px; height:6px; border-radius:50%; display:inline-block;}
.cal-more{font-size:11px; color:var(--ink-soft); font-weight:600;}
.cal-legend{display:flex; align-items:center; gap:4px; justify-content:flex-end; margin-top:10px; font-size:11px; color:var(--ink-soft);}
.cal-legend .cal-dot{width:12px; height:12px; border-radius:3px; background:var(--paper-2);}
.cal-legend .cal-lv0{background:var(--paper-2);}
.cal-legend .cal-lv1{background:var(--indigo-tint);}
.cal-legend .cal-lv2{background:#B9C7F2;}
.cal-legend .cal-lv3{background:#7C93E0;}
.cal-legend .cal-lv4{background:var(--indigo);}
.tab{
  flex:0 0 auto; padding:8px 15px; border-radius:20px; background:var(--paper-2); border:1px solid var(--line);
  font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer; white-space:nowrap;
}
.tab.active{background:var(--indigo); color:#fff; border-color:var(--indigo);}

.searchbar{display:flex; gap:8px; margin-bottom:12px;}
.searchbar input{flex:1;}

.pill-searchbar{
  display:flex; align-items:center; gap:8px; margin-bottom:12px;
  background:var(--card); border:1px solid var(--line); border-radius:24px;
  padding:10px 16px; box-shadow:var(--shadow);
}
.pill-searchbar .ps-ico{display:flex; color:var(--ink-soft); flex:0 0 auto;}
.pill-searchbar .ps-ico svg{width:16px; height:16px;}
.pill-searchbar input{flex:1; border:none; outline:none; background:transparent; font-size:14px; color:var(--ink); padding:0;}
.pill-searchbar:focus-within{border-color:var(--indigo);}
.pill-searchbar .ps-clear{
  flex:0 0 auto; border:none; background:var(--paper-2); color:var(--ink-soft); width:20px; height:20px;
  border-radius:50%; font-size:14px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;
}

.filter-row select.pill-select{
  appearance:none; -webkit-appearance:none;
  flex:0 0 auto; min-width:0; padding:8px 30px 8px 15px; border-radius:20px;
  background:var(--paper-2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="%235B6178" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>') no-repeat right 10px center/12px;
  border:1px solid var(--line); font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer;
}
.filter-row select.pill-select.active{background-color:var(--indigo-tint); border-color:var(--indigo); color:var(--indigo);}
.filter-row .pill-toggle{
  flex:0 0 auto; display:flex; align-items:center; gap:6px; padding:8px 14px; border-radius:20px;
  background:var(--paper-2); border:1px solid var(--line); font-size:14px; font-weight:600; color:var(--ink-soft); cursor:pointer;
}
.filter-row .pill-toggle svg{width:14px; height:14px;}
.filter-row .pill-toggle.active{background:var(--amber-tint); border-color:var(--amber); color:var(--amber);}

.star-mark{color:var(--amber);}
.card.is-important{border:1px solid var(--amber);}
.filter-row{display:flex; gap:8px; overflow-x:auto; margin-bottom:12px;}
.filter-row select{flex:0 0 auto; min-width:120px;}

/* empty state */
.empty{
  text-align:center; padding:38px 20px; color:var(--ink-soft);
}
.empty .ee{font-size:40px; margin-bottom:10px;}
.empty h4{color:var(--ink); font-size:16px; margin-bottom:4px;}
.empty p{font-size:14px;}

/* modal */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(20,22,35,.45); z-index:100; display:none;
  align-items:flex-end; justify-content:center;
}
.modal-backdrop.open{display:flex;}
.modal{
  background:var(--paper); width:100%; max-width:520px; border-radius:22px 22px 0 0;
  padding:20px 18px calc(20px + env(safe-area-inset-bottom,0px)) 18px; max-height:88vh; overflow-y:auto;
  animation:slideup .25s ease;
}
@media (min-width:640px){
  .modal-backdrop{align-items:center;}
  .modal{border-radius:22px; max-height:82vh;}
}
@keyframes slideup{from{transform:translateY(30px); opacity:.6;} to{transform:translateY(0); opacity:1;}}
.modal-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px;}
.modal-head h3{font-size:18px;}
.modal-close{width:30px; height:30px; border-radius:50%; border:none; background:var(--paper-2); color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; justify-content:center;}
.modal-actions{display:flex; gap:10px; margin-top:6px;}
.modal-actions .btn{flex:1;}

/* toast */
.toast{
  position:fixed; bottom:90px; left:50%; transform:translateX(-50%);
  background:var(--ink); color:var(--paper); padding:11px 18px; border-radius:24px; font-size:14px;
  font-weight:600; z-index:200; opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
  box-shadow:0 8px 24px rgba(0,0,0,.25); display:flex; align-items:center; gap:10px; white-space:nowrap;
}
:root[data-theme="dark"] .toast{background:#EDEFF7; color:#12141C;}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-6px); pointer-events:auto;}
.toast-action{background:none; border:none; color:#8FB0FF; font-weight:700; font-size:14px; cursor:pointer; padding:0;}
:root[data-theme="dark"] .toast-action{color:#3E4FD9;}
@media (min-width:900px){.toast{bottom:24px;}}

/* bottom nav mobile */
.bottomnav{
  position:fixed; left:0; right:0; bottom:0; z-index:50;
  background:var(--card); border-top:1px solid var(--line);
  display:flex; padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px)) 4px;
}
.bn-item{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 2px;
  border:none; background:none; color:var(--ink-soft); font-size:11px; font-weight:600; cursor:pointer;
}
.bn-item svg{width:20px; height:20px;}
.bn-item.active{color:var(--indigo);}
@media (min-width:900px){
  .bottomnav{display:none;}
  .sidebar{display:flex;}
  .main{padding:28px 34px 40px 34px;}
}
@media (max-width:899px){
  .main{padding-bottom:88px;}
}

/* timer */
.timer-mode-label{text-align:center; font-size:12px; color:var(--ink-soft); font-weight:600;}
.timer-controls{display:flex; gap:10px; justify-content:center; margin-top:14px; flex-wrap:wrap;}
.timer-controls .btn{min-width:96px;}
.timer-ring{position:relative; width:min(290px,78vw); aspect-ratio:1; margin:6px auto 4px; color:var(--indigo); transition:color .4s;}
.timer-ring.brk{color:var(--green);}
.timer-ring svg{position:absolute; inset:0; width:100%; height:100%; overflow:visible;}
.timer-glow{position:absolute; inset:14%; border-radius:50%; background:currentColor; filter:blur(30px); opacity:.10; transition:opacity .4s;}
.timer-ring.running .timer-glow{animation:tbreathe 3.6s ease-in-out infinite;}
.timer-track{fill:none; stroke:var(--line); stroke-width:10;}
.timer-prog{fill:none; stroke:url(#timerGrad); stroke-width:10; stroke-linecap:round; transition:stroke-dashoffset .3s linear, opacity .3s;}
.timer-dot{fill:var(--card); stroke:currentColor; stroke-width:3.5; transition:opacity .3s;}
.timer-ring.running .timer-dot{animation:tdot 1.6s ease-in-out infinite; transform-box:fill-box; transform-origin:center;}
.timer-tick{stroke:var(--line); stroke-width:2; stroke-linecap:round; transition:stroke .25s;}
.timer-tick.on{stroke:currentColor; opacity:.85;}
.timer-tick.now{stroke:currentColor; stroke-width:3.6;}
.timer-ring.paused .timer-prog{opacity:.5;}
.timer-center{position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px; pointer-events:none;}
.timer-digits{font-family:var(--font-mono); font-size:40px; font-weight:600; letter-spacing:.5px; color:var(--ink); font-variant-numeric:tabular-nums;}
.timer-digits.long{font-size:40px;}
.timer-ring.paused .timer-digits{animation:tblink 1.6s ease-in-out infinite;}
.timer-ring.done{animation:tdone .8s ease-out;}
@keyframes tbreathe{0%,100%{transform:scale(.9); opacity:.10;} 50%{transform:scale(1.08); opacity:.28;}}
@keyframes tdot{0%,100%{transform:scale(1);} 50%{transform:scale(1.28);}}
@keyframes tblink{0%,100%{opacity:1;} 50%{opacity:.4;}}
@keyframes tdone{0%{transform:scale(1);} 30%{transform:scale(1.07);} 60%{transform:scale(.98);} 100%{transform:scale(1);}}
@media (prefers-reduced-motion:reduce){
  .timer-ring.running .timer-glow, .timer-ring.running .timer-dot, .timer-ring.paused .timer-digits, .timer-ring.done{animation:none;}
}

/* bar chart (css based) */
.barchart{display:flex; align-items:flex-end; gap:8px; height:140px; padding-top:10px;}
.barchart .bcol{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
.barchart .bcol .bar{width:100%; max-width:26px; border-radius:6px 6px 3px 3px; background:var(--indigo); min-height:3px;}
.barchart .bcol .blabel{font-size:11px; color:var(--ink-soft);}
.barchart .bcol .bval{font-size:11px; color:var(--ink-soft); font-weight:600;}

.hbar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.hbar-row .hb-label{width:88px; flex-shrink:0; font-size:12px; font-weight:600; color:var(--ink-soft);}
.hbar-row .hb-track{flex:1; height:10px; background:var(--paper-2); border-radius:6px; overflow:hidden;}
.hbar-row .hb-track > div{height:100%; border-radius:6px;}
.hbar-row .hb-val{width:38px; text-align:right; font-size:12px; font-weight:700; flex-shrink:0;}

.two-col{display:grid; grid-template-columns:1fr; gap:12px;}
@media (min-width:760px){.two-col{grid-template-columns:1.3fr 1fr;}}

.chip-row{display:flex; gap:8px; flex-wrap:wrap;}
.chip{padding:6px 12px; border-radius:20px; background:var(--paper-2); border:1px solid var(--line); font-size:12px; font-weight:600; color:var(--ink-soft);}

table.simple{width:100%; border-collapse:collapse; font-size:14px;}
table.simple th{text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:.03em; color:var(--slate); padding:6px 8px; border-bottom:1px solid var(--line);}
table.simple td{padding:9px 8px; border-bottom:1px solid var(--line);}
.table-wrap{overflow-x:auto;}

.streak-flame{display:flex; align-items:center; gap:8px;}
.streak-flame .num{font-family:var(--font-head); font-size:28px; font-weight:700; color:var(--amber);}


/* ---------- Portrait only ---------- */
.rotate-notice{
  display:none; position:fixed; inset:0; z-index:300; background:var(--paper); color:var(--ink);
  flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:24px;
}
.rotate-notice svg{width:54px; height:54px; color:var(--indigo); animation:rotphone 2.4s ease-in-out infinite;}
.rotate-notice h2{font-size:18px; font-weight:700;}
.rotate-notice p{color:var(--ink-soft); font-size:14px;}
@keyframes rotphone{0%,25%{transform:rotate(90deg);} 60%,100%{transform:rotate(0deg);}}
@media (prefers-reduced-motion:reduce){ .rotate-notice svg{animation:none;} }

/* ---------- Auth screen ---------- */
.auth-screen{
  position:fixed; inset:0; z-index:150; background:var(--paper); overflow-y:auto;
  display:flex; align-items:flex-start; justify-content:center;
  padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(28px + env(safe-area-inset-bottom,0px));
}
.auth-screen[hidden], .auth-screen [hidden]{display:none !important;}
.auth-wrap{width:100%; max-width:400px; margin:auto 0;}
.auth-brand{display:flex; align-items:baseline; gap:8px; margin-bottom:26px;}
.auth-brand .brand-mark{font-size:28px;}
.auth-brand .brand-sub{font-size:14px;}
.auth-wrap h2{font-size:24px; font-weight:700; margin-bottom:6px;}
.auth-lead{color:var(--ink-soft); font-size:14px; line-height:1.5; margin-bottom:20px;}
.auth-card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius-lg); padding:20px; box-shadow:var(--shadow);}
.auth-card .seg{margin-bottom:18px;}
.auth-card .seg button{padding:10px 6px; font-size:14px;}
.auth-card .field input{padding:12px 13px; font-size:16px;}
.pw-row{position:relative;}
.pw-row input{padding-right:64px;}
.pw-toggle{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  background:none; border:none; color:var(--indigo); font-weight:600; font-size:12px;
  padding:8px; cursor:pointer; border-radius:8px;
}
.pw-toggle:focus-visible, .auth-link:focus-visible{outline:2px solid var(--indigo); outline-offset:2px;}
.auth-msg{display:none; font-size:14px; line-height:1.45; padding:10px 12px; border-radius:10px; margin-bottom:14px;}
.auth-msg.show{display:block;}
.auth-msg.error{background:var(--red-tint); color:var(--red);}
.auth-msg.ok{background:var(--green-tint); color:var(--green);}
.auth-card .btn{padding:13px 18px; font-size:16px; margin-top:6px;}
.auth-card .btn[disabled]{opacity:.6; cursor:default;}
.auth-link{background:none; border:none; color:var(--indigo); font-weight:600; font-size:14px; cursor:pointer; padding:6px 0;}
.auth-foot{display:flex; justify-content:center; margin-top:10px;}
.auth-loading{display:flex; align-items:center; justify-content:center; gap:10px; color:var(--ink-soft); font-size:14px; margin:auto;}
.auth-spinner{width:18px; height:18px; border-radius:50%; border:2.5px solid var(--line); border-top-color:var(--indigo); animation:authspin .8s linear infinite;}
@keyframes authspin{to{transform:rotate(360deg);}}
@media (prefers-reduced-motion:reduce){ .auth-spinner{animation-duration:2.4s;} }
.home-greet{margin-bottom:16px;}
.home-greet h2{font-size:24px; font-weight:700; line-height:1.25;}
.home-greet p{color:var(--ink-soft); font-size:14px; margin-top:3px;}
.plan-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; margin-bottom:14px;}
.plan-goal{font-weight:700; font-size:16px; line-height:1.3;}
.plan-dream{color:var(--ink-soft); font-size:14px; margin-top:2px;}
.plan-stats{display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:12px;}
.plan-stat{background:var(--paper-2); border-radius:12px; padding:10px 6px; text-align:center;}
.plan-stat .v{font-family:var(--font-head); font-weight:700; font-size:18px; line-height:1.1;}
.plan-stat .l{font-size:11px; color:var(--ink-soft); margin-top:4px; line-height:1.25;}
.plan-pace{font-size:14px; line-height:1.45; margin-bottom:12px; color:var(--ink-soft);}
.plan-pace b.ok{color:var(--green);}
.plan-pace b.behind{color:var(--red);}
.plan-dot{width:9px; height:9px; border-radius:50%; flex-shrink:0;}
.plan-note{background:var(--indigo-tint); border-radius:12px; padding:10px 12px; font-size:14px; line-height:1.5; margin-top:12px;}
.plan-link{background:none; border:none; color:var(--indigo); font-weight:600; font-size:14px; padding:0; cursor:pointer; text-decoration:underline;}
.plan-foot{font-size:12px; color:var(--ink-soft); margin-top:12px; line-height:1.4;}
.gl-check{display:flex; align-items:center; gap:8px; font-size:14px; margin-bottom:4px;}
.gl-check input{width:18px; height:18px;}
.account-email{font-family:var(--font-mono); font-size:14px; word-break:break-all; margin-bottom:14px;}
@media print{ .sidebar,.bottomnav,.fab{display:none;} }

/* Chapter list: square tiles with outer progress ring */
.ch-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:14px;}
@media(min-width:600px){ .ch-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));} }
.ch-tile-wrap{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px;}
.ch-badge{position:absolute; top:-7px; right:-7px; width:26px; height:26px; border-radius:50%; display:flex; align-items:center; justify-content:center;
  color:#fff; border:2.5px solid var(--paper); box-shadow:0 1px 4px rgba(0,0,0,.18); z-index:2; pointer-events:none;}
.ch-badge svg{width:14px; height:14px;}
.ch-badge.done{background:var(--green);}
.ch-badge.rev{background:var(--indigo);}
.ch-pct.done{color:var(--green);}
.ch-pct.rev{color:var(--indigo);}
.ch-tile{width:100%; aspect-ratio:1/1; padding:5px; border-radius:20px; cursor:pointer; --ring:var(--indigo);
  background:conic-gradient(var(--ring) calc(var(--p) * 1%), var(--line) 0);
  -webkit-tap-highlight-color:transparent; transition:transform .12s;}
.ch-tile:active{transform:scale(.97);}
.ch-tile.full{--ring:var(--green);}
.ch-tile-in{width:100%; height:100%; border-radius:15px; background:var(--card); color:var(--ink);
  display:flex; align-items:center; justify-content:center; text-align:center; padding:10px; overflow:hidden;}
.ch-tile-in span{font-weight:700; font-size:14px; line-height:1.3; word-break:break-word;
  display:-webkit-box; -webkit-line-clamp:5; -webkit-box-orient:vertical; overflow:hidden;}
.ch-tile.gold .ch-tile-in{background:linear-gradient(135deg,#FCE38A,#F2B705); color:#4A3500;}
.ch-pct{font-size:12px; font-weight:700; color:var(--ink-soft);}

/* Timetable */
.tt-nav{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
.tt-nav .tt-date{flex:1; text-align:center; font-weight:700; font-size:14px;}
.tt-nav .tt-date small{display:block; font-weight:600; font-size:12px; color:var(--ink-soft);}
.tt-block{display:flex; gap:10px; margin-bottom:8px;}
.tt-time{width:62px; flex-shrink:0; text-align:right; font-size:11px; color:var(--ink-soft); display:flex; flex-direction:column; padding-top:12px; line-height:1.35;}
.tt-time b{color:var(--ink); font-size:12px; font-weight:700;}
.tt-card{flex:1; min-width:0; background:var(--card); border:1px solid var(--line); border-left:4px solid var(--kc); border-radius:14px; padding:10px 12px; cursor:pointer;}
.tt-block.now .tt-card{box-shadow:0 0 0 2px var(--kc);}
.tt-block.done .tt-card{opacity:.6;}
.tt-block.done .tt-title{text-decoration:line-through;}
.tt-block.missed .tt-card{background:var(--paper-2);}
.tt-top{display:flex; align-items:flex-start; gap:8px;}
.tt-title{flex:1; min-width:0; font-weight:600; font-size:14px; overflow-wrap:anywhere;}
.tt-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.tt-tags{display:flex; gap:6px; flex-wrap:wrap; margin-top:6px; align-items:center;}
.tt-check{width:28px; height:28px; border-radius:50%; border:2px solid var(--line); background:transparent; color:transparent; display:flex; align-items:center; justify-content:center; flex-shrink:0; cursor:pointer; padding:0;}
.tt-check.on{background:var(--green); border-color:var(--green); color:#fff;}
.tt-check svg{width:14px; height:14px;}
.tt-gap{margin:0 0 8px 72px; font-size:12px; color:var(--ink-soft); border-left:2px dashed var(--line); padding:2px 0 2px 10px;}
.tt-days{display:flex; gap:6px; flex-wrap:wrap;}
.tt-day{padding:7px 11px; border-radius:999px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); font-size:12px; font-weight:600; cursor:pointer;}
.tt-day.active{background:var(--indigo); border-color:var(--indigo); color:#fff;}
.upnext{border-left:4px solid var(--kc); cursor:pointer;}
/* ---------- Avatar / Profile / new Settings look ---------- */
.avatar-btn{flex:0 0 38px;min-width:38px;aspect-ratio:1/1;box-sizing:border-box;width:38px;height:38px;border-radius:50%;border:2px solid var(--indigo);padding:0;overflow:hidden;cursor:pointer;background:var(--indigo-tint);color:var(--indigo);font:700 16px var(--font-head);display:flex;align-items:center;justify-content:center}
.avatar-btn img,.pf-avatar img{width:100%;height:100%;object-fit:cover;display:block}
.pf-top{position:relative;text-align:center;padding:10px 0 22px}
.pf-gear{position:absolute;top:0;right:0;width:38px;height:38px;border-radius:50%;border:none;background:transparent;color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;justify-content:center}
.pf-gear svg{width:21px;height:21px}
.pf-avatar{width:88px;height:88px;border-radius:50%;margin:0 auto 12px;overflow:hidden;background:var(--indigo-tint);color:var(--indigo);display:flex;align-items:center;justify-content:center;font:700 40px var(--font-head)}
.pf-name{font:700 18px var(--font-head);word-break:break-word}
.pf-sub{font-size:12px;color:var(--ink-soft);margin:2px 0 8px}
.pf-edit{background:none;border:none;color:var(--indigo);font-weight:600;font-size:14px;cursor:pointer;padding:4px 8px}

<script>

const FIREBASE_CONFIG = {
  apiKey: "AIzaSyDeqgWmnjwLzgBtUxJEQ2nm4-RFjr5CVx4",
  authDomain: "jee-tracker-27722.firebaseapp.com",
  projectId: "jee-tracker-27722",

};
const FIREBASE_ENABLED = !!(FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('PASTE_'));
let fbAuth=null, fbDb=null, fbUid=null, fbReady=false, fbUser=null;

function initFirebase(){
  if(!FIREBASE_ENABLED) return false;
  try{
    firebase.initializeApp(FIREBASE_CONFIG);
    fbAuth = firebase.auth();
    fbDb = firebase.firestore();
    fbDb.enablePersistence().catch(()=>{}); // offline cache, ignore if unsupported/multi-tab
    return true;
  }catch(e){ console.error('Firebase init failed', e); return false; }
}
/* Returns the saved document, null if this user has none yet, or undefined if the read failed. */
async function fbLoad(){
  if(!fbUid) return undefined;
  try{
    const snap = await fbDb.collection('users').doc(fbUid).get();
    return snap.exists ? snap.data() : null;
  }catch(e){ console.error('Firestore load failed', e); return undefined; }
}
function fbSave(){
  if(!fbReady || !DATA) return;
  fbDb.collection('users').doc(fbUid).set(DATA).catch(e=>console.error('Firestore save failed', e));
}

/* ---------------- Auth (email + password) ---------------- */
let authMode = 'login';   // 'login' | 'signup'
let pendingName = '';

const AUTH_ERRORS = {
  'auth/invalid-email': 'That email address doesn’t look right. Check it and try again.',
  'auth/missing-email': 'Enter your email address.',
  'auth/missing-password': 'Enter your password.',
  'auth/user-not-found': 'No account found with this email. Sign up to create one.',
  'auth/wrong-password': 'Wrong password. Try again or reset it.',
  'auth/invalid-credential': 'Email or password is incorrect.',
  'auth/invalid-login-credentials': 'Email or password is incorrect.',
  'auth/email-already-in-use': 'This email already has an account. Log in instead.',
  'auth/weak-password': 'Password is too short. Use at least 6 characters.',
  'auth/too-many-requests': 'Too many attempts. Wait a few minutes, or reset your password.',
  'auth/network-request-failed': 'No internet connection. Check your network and try again.',
  'auth/user-disabled': 'This account has been disabled.',
  'auth/operation-not-allowed': 'Email sign-in is turned off. Enable Email/Password under Authentication → Sign-in method in the Firebase console.',
  'auth/unauthorized-domain': 'This site’s domain isn’t authorised. Add it under Authentication → Settings → Authorized domains in the Firebase console.',
  'auth/operation-not-supported-in-this-environment': 'Login needs the app to be opened from a website (http/https), not as a local file.'
};
function authMsg(text, type){
  const el = document.getElementById('authMsg');
  el.textContent = text || '';
  el.className = 'auth-msg' + (text ? ' show ' + (type||'error') : '');
}
function setAuthMode(mode){
  authMode = mode;
  const signup = mode==='signup';
  document.getElementById('tabLogin').classList.toggle('active', !signup);
  document.getElementById('tabSignup').classList.toggle('active', signup);
  document.getElementById('authTitle').textContent = signup ? 'Create your account' : 'Welcome back';
  document.getElementById('authLead').textContent = signup
    ? 'Your syllabus, tests and streaks stay saved to your account.'
    : 'Log in to see your progress on any device.';
  document.getElementById('nameField').hidden = !signup;
  document.getElementById('forgotRow').hidden = signup;
  document.getElementById('authSubmit').textContent = signup ? 'Create account' : 'Log in';
  document.getElementById('authPass').setAttribute('autocomplete', signup ? 'new-password' : 'current-password');
  authMsg('');
}
function showAuthScreen(){
  document.getElementById('authScreen').hidden = false;
  document.getElementById('authLoading').hidden = true;
  document.getElementById('authWrap').hidden = false;
}
function hideAuthScreen(){
  document.getElementById('authScreen').hidden = true;
}
function showAuthLoading(msg){
  document.getElementById('authScreen').hidden = false;
  document.getElementById('authWrap').hidden = true;
  const l = document.getElementById('authLoading');
  l.hidden = false;
  l.querySelector('span:last-child').textContent = msg || 'Loading…';
}
async function submitAuth(e){
  e.preventDefault();
  const email = document.getElementById('authEmail').value.trim();
  const pass = document.getElementById('authPass').value;
  if(authMode==='signup' && !document.getElementById('authName').value.trim()){ authMsg('Enter your name.'); return; }
  if(!email){ authMsg(AUTH_ERRORS['auth/missing-email']); return; }
  if(!pass){ authMsg(AUTH_ERRORS['auth/missing-password']); return; }
  const btn = document.getElementById('authSubmit');
  const label = btn.textContent;
  btn.disabled = true; btn.textContent = authMode==='signup' ? 'Creating account…' : 'Logging in…';
  authMsg('');
  try{
    if(authMode==='signup'){
      pendingName = document.getElementById('authName').value.trim();
      const cred = await fbAuth.createUserWithEmailAndPassword(email, pass);
      try{ if(cred && cred.user && cred.user.updateProfile) await cred.user.updateProfile({displayName: pendingName}); }catch(e){}
    } else {
      await fbAuth.signInWithEmailAndPassword(email, pass);
    }
    // onAuthStateChanged takes it from here
  }catch(err){
    console.error('Auth error', err);
    authMsg(AUTH_ERRORS[err.code] || 'Something went wrong. Please try again.');
    btn.disabled = false; btn.textContent = label;
  }
}
async function forgotPassword(){
  const email = document.getElementById('authEmail').value.trim();
  if(!email){ authMsg('Enter your email above first, then tap “Forgot password?”.'); return; }
  try{
    await fbAuth.sendPasswordResetEmail(email);
    authMsg('Reset link sent to ' + email + '. Check your inbox and spam folder.', 'ok');
  }catch(err){
    authMsg(AUTH_ERRORS[err.code] || 'Could not send the reset email. Please try again.');
  }
}
function logout(){
  if(!fbAuth){ return; }
  fbAuth.signOut().then(()=>location.reload());
}
function initAuthUI(){
  document.getElementById('tabLogin').addEventListener('click', ()=>setAuthMode('login'));
  document.getElementById('tabSignup').addEventListener('click', ()=>setAuthMode('signup'));
  document.getElementById('authForm').addEventListener('submit', submitAuth);
  document.getElementById('forgotBtn').addEventListener('click', forgotPassword);
  document.getElementById('pwToggle').addEventListener('click', ()=>{
    const inp = document.getElementById('authPass');
    const show = inp.type==='password';
    inp.type = show ? 'text' : 'password';
    const b = document.getElementById('pwToggle');
    b.textContent = show ? 'Hide' : 'Show';
    b.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });
}

/* ============================================================
   JEE TRACKER — core state, storage, utilities
   ============================================================ */
const LEGACY_LS_KEY = 'jeeTrackerData_v1';   // old single-user key
let LS_KEY = LEGACY_LS_KEY;                   // becomes jeeTrackerData_v1_<uid> after login
const uid = () => Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4);
function ymd(d){
  const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
const todayStr = () => ymd(new Date());
const $ = (sel, root=document) => root.querySelector(sel);
const $all = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function fmtDate(d){
  if(!d) return '—';
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN', {day:'numeric', month:'short', year:'numeric'});
}
function fmtDateShort(d){
  const dt = new Date(d + 'T00:00:00');
  if(isNaN(dt)) return d;
  return dt.toLocaleDateString('en-IN', {day:'numeric', month:'short'});
}
function daysBetween(a,b){
  const A = new Date(a+'T00:00:00'), B = new Date(b+'T00:00:00');
  return Math.round((B-A)/86400000);
}
function addDays(dateStr, n){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+n);
  return ymd(d);
}
function clamp(n,a,b){return Math.max(a, Math.min(b,n));}
function pct(part, whole){ if(!whole) return 0; return clamp(Math.round((part/whole)*100),0,100); }
function hoursToHM(hDecimal){
  const h = Math.floor(hDecimal);
  const m = Math.round((hDecimal-h)*60);
  if(h<=0 && m<=0) return '0m';
  if(h<=0) return m+'m';
  if(m<=0) return h+'h';
  return h+'h '+m+'m';
}
function secToClock(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const pad = n => String(n).padStart(2,'0');
  return h>0 ? `${pad(h)}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
}
function esc(str){
  return String(str==null?'':str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function toast(msg, action){
  const t = $('#toast');
  clearTimeout(toast._tm);
  if(action){
    t.innerHTML = `<span>${esc(msg)}</span><button type="button" class="toast-action" id="toastActionBtn">${esc(action.label)}</button>`;
    document.getElementById('toastActionBtn').addEventListener('click', ()=>{
      t.classList.remove('show');
      clearTimeout(toast._tm);
      action.onClick();
    });
  } else {
    t.textContent = msg;
  }
  t.classList.add('show');
  toast._tm = setTimeout(()=>t.classList.remove('show'), action ? 5000 : 2200);
}

function normalizeWeightage(w){

function loadData(){

      DATA.settings = Object.assign(defaultData().settings, parsed.settings||{});
      DATA.streaks = Object.assign(defaultData().streaks, parsed.streaks||{});
      if(!DATA.chapters || DATA.chapters.length===0) DATA.chapters = defaultData().chapters;

// Rough JEE Main marks(out of 300) -> percentile curve, based on commonly observed
// past-year trends for a candidate pool of roughly 17 lakh. This is an ESTIMATE only —
// actual percentile depends on that session's specific difficulty/distribution.
const JEE_MARKS_PERCENTILE_TABLE = [
  [300,100], [280,99.99], [250,99.95], [220,99.85], [200,99.65],
  [180,99.3], [160,98.6], [140,97.2], [120,94.5], [100,90],
  [90,86], [80,80.5], [70,74], [60,66], [50,56],
  [40,45], [30,33], [20,21], [10,10], [0,0]
];
function estimateJeeMainPercentile(marks){
  const t = JEE_MARKS_PERCENTILE_TABLE;
  const m = Math.max(0, Math.min(300, Number(marks)||0));
  for(let i=0;i<t.length-1;i++){
    const [m1,p1] = t[i], [m2,p2] = t[i+1];
    if(m<=m1 && m>=m2){
      const frac = (m-m2)/(m1-m2);
      return Math.round((p2 + frac*(p1-p2))*100)/100;
    }
  }
  return m>=300 ? 100 : 0;
}
function recentPercentileAvg(n=3){
  const withPct = DATA.tests.filter(t=>t.percentile!=null).slice().sort((a,b)=>b.date.localeCompare(a.date)).slice(0,n);
  if(!withPct.length) return null;
  return Math.round((withPct.reduce((s,t)=>s+Number(t.percentile),0)/withPct.length)*100)/100;
}
function computeRecords(){

  allStudy().forEach(s=>{ dailyMinutes[s.date] = (dailyMinutes[s.date]||0) + Number(s.minutes||0); });
  const bestDayEntries = Object.entries(dailyMinutes).sort((a,b)=>b[1]-a[1]);
  const bestDay = bestDayEntries[0] || null;

  const dailyQ = {};
  DATA.practiceSessions.forEach(p=>{ dailyQ[p.date] = (dailyQ[p.date]||0) + Number(p.attempted||0); });
  const bestQEntries = Object.entries(dailyQ).sort((a,b)=>b[1]-a[1]);
  const bestQ = bestQEntries[0] || null;

  const sortedTests = DATA.tests.slice().sort((a,b)=>a.date.localeCompare(b.date));
  let bestJump = null;
  for(let i=1;i<sortedTests.length;i++){
    const diff = Number(sortedTests[i].total||0) - Number(sortedTests[i-1].total||0);
    if(bestJump===null || diff>bestJump) bestJump = diff;

  const bestScore = DATA.tests.length ? Math.max(...DATA.tests.map(t=>Number(t.total||0))) : null;

  return {

    bestQ: bestQ ? bestQ[1] : 0, bestQDate: bestQ ? bestQ[0] : null,

}

/* Study time = timer sessions + time logged in practice entries
   (practice entries created from the timer are skipped: that time is already a session). */
function allStudy(){
  const ss=DATA.studySessions, used=new Set();
  const extra=[];
  DATA.practiceSessions.forEach(p=>{
    const m=Number(p.timeMinutes)||0; if(m<=0||p.fromTimer===true) return;
    if(p.fromTimer===false){ extra.push({id:p.id,date:p.date,minutes:m,subject:p.subject,chapter:p.chapter,fromPractice:true}); return; }
    const hit=ss.findIndex((x,i)=>!used.has(i)&&x.date===p.date&&(x.subject||'')===(p.subject||'')&&(x.chapter||'')===(p.chapter||'')&&Math.abs(Number(x.minutes||0)-m)<=1);
    if(hit>-1){ used.add(hit); return; }
    extra.push({id:p.id,date:p.date,minutes:m,subject:p.subject,chapter:p.chapter,fromPractice:true});
  });
  return ss.concat(extra);
}

function todayHasStudyActivity(){
  const minMinutes = Math.max(0, Number(DATA.settings.minStudyMinutesForStreak)||0);
  const minutesToday = studyHoursOn(todayStr())*60;
  if(minMinutes<=0) return minutesToday > 0;

}
function todayHasQuestionActivity(){
  const minQ = Math.max(0, Number(DATA.settings.minQuestionsForStreak)||0);
  const qToday = questionsSolvedOn(todayStr());
  if(minQ<=0) return qToday > 0;
  return qToday >= minQ;
}
function todayHasRevisionActivity(){
  const minRev = Math.max(0, Number(DATA.settings.minRevisionsForStreak)||0);
  const count = DATA.revisions.filter(r=> r.completedDate === todayStr()).length;
  if(minRev<=0) return count > 0;
  return count >= minRev;
}
function bumpStreak(key, activeToday){
  const s = DATA.streaks[key];
  if(!activeToday) return;
  if(s.lastDate === todayStr()) return; // already counted today
  if(s.lastDate === addDays(todayStr(),-1)){
    s.current += 1;
  } else {
    s.current = 1;
    s.startDate = todayStr();
  }
  s.lastDate = todayStr();
  if(s.current > s.longest){
    s.longest = s.current;
    s.bestStart = s.startDate;
    s.bestEnd = todayStr();
  }
}
/* Older saved data has no start/end dates — rebuild them where they can be worked out. */
function ensureStreakDates(s){
  if(s.lastDate && s.current>0 && !s.startDate) s.startDate = addDays(s.lastDate, -(s.current-1));
  if(s.longest>0 && !s.bestStart && s.longest===s.current && s.startDate){
    s.bestStart = s.startDate;
    s.bestEnd = s.lastDate;
  }
}
/* Streaks are rebuilt from the real history every time, so deleting a session,
   practice entry or revision can never leave a fake streak behind. */
function streakActiveDates(key){
  const st=DATA.settings;
  if(key==='study'){
    const min=Math.max(0,Number(st.minStudyMinutesForStreak)||0);
    return [...new Set(allStudy().map(x=>x.date).filter(Boolean))].filter(d=>{ const m=studyHoursOn(d)*60; return min<=0 ? m>0 : m>=min; });
  }
  if(key==='question'){
    const min=Math.max(0,Number(st.minQuestionsForStreak)||0);
    return [...new Set(DATA.practiceSessions.map(x=>x.date).filter(Boolean))].filter(d=>{ const q=questionsSolvedOn(d); return min<=0 ? q>0 : q>=min; });
  }
  const min=Math.max(0,Number(st.minRevisionsForStreak)||0);
  return [...new Set(DATA.revisions.map(r=>r.completedDate).filter(Boolean))].filter(d=>{ const c=DATA.revisions.filter(r=>r.completedDate===d).length; return min<=0 ? c>0 : c>=min; });
}
function rebuildStreak(key){
  const s=DATA.streaks[key], dates=streakActiveDates(key).sort();
  let longest=0,bestStart=null,bestEnd=null,runStart=null,prev=null,len=0;
  dates.forEach(d=>{
    if(prev && addDays(prev,1)===d){ len++; } else { len=1; runStart=d; }
    if(len>longest){ longest=len; bestStart=runStart; bestEnd=d; }
    prev=d;
  });
  const last=dates.length?dates[dates.length-1]:null;
  s.lastDate=last; s.longest=longest; s.bestStart=bestStart; s.bestEnd=bestEnd;
  if(last && last>=addDays(todayStr(),-1)){ s.current=len; s.startDate=runStart; }
  else { s.current=0; s.startDate=null; }
}
function recomputeStreaks(){
  ['study','question','revision'].forEach(rebuildStreak);
  saveData();
}

const PLAN_SUBJECTS = ['Physics','Chemistry','Mathematics'];
const PLAN_COLORS = {Physics:'#3E6FD9', Chemistry:'var(--green)', Mathematics:'var(--amber)'};
// Reference points only — based on recent (2025-26) JoSAA/UPTAC closing ranks for
// General category CSE, converted to a percentile estimate assuming ~17 lakh JEE Main
// candidates (same assumption used elsewhere in this app). Actual cutoffs shift every

const GOAL_TYPES = {
  main_pct:  {label:'JEE Main percentile',      exam:'main', valueLabel:'Target percentile', placeholder:'e.g. 99'},
  main_rank: {label:'JEE Main rank (AIR)',      exam:'main', valueLabel:'Target rank (better than)', placeholder:'e.g. 10000'},
  adv_rank:  {label:'JEE Advanced rank (AIR)',  exam:'adv',  valueLabel:'Target rank (better than)', placeholder:'e.g. 2500'}
};
/* Rough guideline levels: how much daily effort a goal usually calls for. */
const GOAL_TIERS = {
  1:{hours:4,   q:40, rev:2, mocks:1},
  2:{hours:5.5, q:50, rev:2, mocks:1},
  3:{hours:7,   q:70, rev:3, mocks:2},
  4:{hours:8.5, q:90, rev:3, mocks:2}
};
function goalTier(type, value){
  const v = Number(value);
  if(type==='main_pct')  return v>=99.5 ? 4 : v>=98 ? 3 : v>=95 ? 2 : 1;
  if(type==='main_rank') return v<=2000 ? 4 : v<=10000 ? 3 : v<=30000 ? 2 : 1;
  return v<=500 ? 4 : v<=2500 ? 3 : v<=7000 ? 2 : 1;   // adv_rank
}
function goalText(g){
  const v = Number(g.value);
  if(g.type==='main_pct')  return `${v} percentile in JEE Main`;
  if(g.type==='main_rank') return `Rank under ${v.toLocaleString('en-IN')} in JEE Main`;
  return `Rank under ${v.toLocaleString('en-IN')} in JEE Advanced`;
}
function remainingChapterWork(subject){
  return DATA.chapters
    .filter(c=>!subject || c.subject===subject)
    .reduce((sum,c)=> c.status==='Not Started' ? sum+1 : c.status==='Studying' ? sum+0.5 : sum, 0);
}
function nextFocusChapter(subject){
  const chs = DATA.chapters.filter(c=>c.subject===subject).sort((a,b)=>(a.order||0)-(b.order||0));
  let c = chs.find(x=>x.status==='Studying');
  if(c) return {name:c.name, note:'in progress'};
  c = chs.find(x=>x.status==='Not Started');
  if(c) return {name:c.name, note:'next up'};
  c = chs.find(x=>x.confidence==='Weak' && x.status!=='Revised');
  if(c) return {name:c.name, note:'weak, revisit it'};
  return null;
}
function buildDailyPlan(){
  const s = DATA.settings, g = s.goal;
  if(!g) return null;
  const tier = GOAL_TIERS[goalTier(g.type, g.value)];
  const examDate = GOAL_TYPES[g.type].exam==='adv' ? s.jeeAdvancedDate : s.jeeMainDate;
  const daysLeft = daysUntil(examDate);
  const plan = {goal:g, tier, examDate, daysLeft, expired: daysLeft<=0, remainingWork: remainingChapterWork(null)};

  if(!plan.expired){
    // keep the last stretch (up to 45 days) free for revision and mock tests
    const buffer = Math.min(45, Math.round(daysLeft*0.3));
    const windowDays = Math.max(1, daysLeft - buffer);
    plan.finishBy = addDays(todayStr(), windowDays);
    plan.perWeekNeeded = Math.round((plan.remainingWork/(windowDays/7))*10)/10;
    // pace: chapters finished per week over the last 1 to 2 weeks (a new tracker isn't judged on days it wasn't used)
    const from = addDays(todayStr(), -14);
    const recent = DATA.chapters.filter(c=>c.completedOn && c.completedOn>from);
    if(recent.length){
      const earliest = recent.map(c=>c.completedOn).sort()[0];
      const span = Math.min(14, Math.max(7, daysBetween(earliest, todayStr())+1));
      plan.pace = Math.round((recent.length/(span/7))*10)/10;
    } else plan.pace = null;
  }

  // split today's hours and questions by how much work each subject still has (min 15% each)
  const raw = PLAN_SUBJECTS.map(sub=>{
    const weak = DATA.chapters.filter(c=>c.subject===sub && c.confidence==='Weak' && c.status!=='Revised').length;
    return remainingChapterWork(sub) + 0.5*weak;
  });
  const totalRaw = raw.reduce((a,b)=>a+b,0);
  const shares = raw.map(r=> totalRaw>0 ? 0.15 + 0.55*(r/totalRaw) : 1/3);
  const split = (total, step)=>{
    const out = []; let used = 0;
    shares.forEach((sh,i)=>{
      if(i===shares.length-1){ out.push(Math.max(0,total-used)); }
      else { const v = Math.round(total*sh/step)*step; out.push(v); used += v; }
    });
    return out;
  };
  const mins = split(Math.round(s.dailyStudyHours*60), 5);
  const qs = split(Number(s.dailyQuestionTarget)||0, 5);
  plan.rows = PLAN_SUBJECTS.map((sub,i)=>({subject:sub, minutes:mins[i], questions:qs[i], focus:nextFocusChapter(sub)}));

  plan.revisionDue = revisionsDueToday().length;
  const lt = latestTest();
  plan.mockGap = Math.ceil(7/tier.mocks);
  plan.mockSince = lt ? daysBetween(lt.date, todayStr()) : null;
  plan.targetsBelow = s.dailyStudyHours <= tier.hours - 1;
  return plan;
}

      <div class="ri-title"><span class="plan-dot" style="background:${PLAN_COLORS[r.subject]};"></span>${r.subject} · ${hoursToHM(r.minutes/60)}</div>

  }).join('');
  const revSub = p.revisionDue>0 ? `${p.revisionDue} due today` : 'Nothing due today. Revise a weak chapter if you have time.';
  let mockTitle, mockSub;
  if(p.mockSince===null){ mockTitle='Take your first mock test'; mockSub=`Aim for ${p.tier.mocks} a week.`; }
  else if(p.mockSince>=p.mockGap){ mockTitle='Mock test due today'; mockSub=`Last one was ${p.mockSince} ${p.mockSince===1?'day':'days'} ago. Aim for ${p.tier.mocks} a week.`; }
  else { const n=p.mockGap-p.mockSince; mockTitle=`Next mock test in ${n} ${n===1?'day':'days'}`; mockSub=`Aim for ${p.tier.mocks} a week.`; }

  return `
  <div class="section-title">Today's plan</div>
  <div class="card">
    ${head}
    <div class="plan-stats">
      <div class="plan-stat"><div class="v">${p.daysLeft}</div><div class="l">days left</div></div>
      <div class="plan-stat"><div class="v">${p.perWeekNeeded}</div><div class="l">chapters a week needed</div></div>
      <div class="plan-stat"><div class="v">${fmtDateShort(p.finishBy)}</div><div class="l">finish syllabus by</div></div>
    </div>
    <p class="plan-pace">${pace}</p>
    ${catchUpNote}
    <div class="list">
      ${rows}
      <div class="row-item"><div class="ri-main"><div class="ri-title">Revision</div><div class="ri-sub">${revSub}</div></div></div>
      <div class="row-item"><div class="ri-main"><div class="ri-title">${mockTitle}</div><div class="ri-sub">${mockSub}</div></div></div>
    </div>
    ${p.targetsBelow ? `<div class="plan-note">This goal usually calls for about ${p.tier.hours}h a day and ${p.tier.q} questions. Your targets are ${s.dailyStudyHours}h and ${s.dailyQuestionTarget}. <button type="button" class="plan-link" onclick="applyGoalTargets()">Use suggested targets</button></div>` : ''}
    <p class="plan-foot">General guidelines, not a rank prediction. Protect your sleep while chasing the hours.</p>
  </div>`;
}

function saveGoal(){
  const type = $('#gl-type').value;
  const value = Number($('#gl-value').value);
  if(!Number.isFinite(value) || value<=0){ toast('Enter your target first'); return; }
  if(type==='main_pct' && value>100){ toast('Percentile cannot be more than 100'); return; }
  if(type!=='main_pct' && value<1){ toast('Rank must be at least 1'); return; }
  const dream = $('#gl-dream').value.trim();
  const apply = $('#gl-apply').checked;
  updateData(d=>{
    d.settings.goal = {type, value: type==='main_pct' ? value : Math.round(value), dream};
    if(apply){
      const t = GOAL_TIERS[goalTier(type, value)];
      d.settings.dailyStudyHours = t.hours;
      d.settings.dailyQuestionTarget = t.q;
      d.settings.dailyRevisionTarget = t.rev;
    }
  });
  closeModal();
  renderAll();
  toast('Goal saved');
}
function removeGoal(){
  updateData(d=>{ d.settings.goal = null; });

  renderAll();

}

  const d = todayStr();
  let hash = 0;

function weeklyRecapHtml(){
  const start = addDays(todayStr(), -7), end = addDays(todayStr(), -1);
  const sessions = allStudy().filter(s=>s.date>=start && s.date<=end);
  const hrs = Math.round(sessions.reduce((a,b)=>a+Number(b.minutes||0),0)/60*10)/10;
  const q = DATA.practiceSessions.filter(p=>p.date>=start && p.date<=end).reduce((a,b)=>a+(Number(b.attempted)||0),0);
  const testsCount = DATA.tests.filter(t=>t.date>=start && t.date<=end).length;
  const subjMins = {Physics:0, Chemistry:0, Mathematics:0};
  sessions.forEach(s=>{ if(subjMins[s.subject]!=null) subjMins[s.subject]+=Number(s.minutes||0); });
  const entries = Object.entries(subjMins);
  const least = entries.length ? entries.reduce((a,b)=>a[1]<=b[1]?a:b)[0] : null;
  return `

/* Shows when a streak started and ended. kind: 'current' | 'best' */
function openStreakDetails(kind){
  const st = DATA.streaks.study;
  const isBest = kind==='best';
  const n = isBest ? st.longest : st.current;
  const yesterday = addDays(todayStr(),-1);
  const alive = st.current>0 && st.lastDate && st.lastDate>=yesterday;   // still running (today or yesterday was active)
  let body;
  if(n<=0){
    body = `<p class="bs-range muted" style="font-size:14px;">${isBest
      ? 'No streak yet. Log a study session today to start one.'
      : 'No active streak right now. Log a study session today to start a new one.'}</p>`;
  } else {
    const start = isBest ? st.bestStart : st.startDate;
    const end   = isBest ? st.bestEnd   : st.lastDate;
    const runningNow = isBest ? (alive && st.current===st.longest && st.bestEnd===st.lastDate) : alive;
    let range, hint = '';
    if(!start){
      range = 'Dates were not recorded for this streak.';
    } else if(runningNow){
      const endTxt = end===todayStr() ? 'today' : 'yesterday';
      range = `<b>${fmtDate(start)}</b> to ${endTxt} <span class="muted">(still going)</span>`;
      if(end!==todayStr()) hint = `<p class="muted" style="margin-top:8px; font-size:14px;">Study today to keep it going.</p>`;
    } else if(start===end){
      range = `On <b>${fmtDate(start)}</b>`;
    } else {
      range = `<b>${fmtDate(start)}</b> to <b>${fmtDate(end)}</b>`;
    }
    body = `<div class="bs-count">${n} ${n===1?'day':'days'}</div><p class="bs-range">${range}</p>${hint}`;
  }
  openModal(`
    <div class="modal-head"><h3>${isBest?'Best streak':'Current streak'}</h3><button class="modal-close" onclick="closeModal()">&times;</button></div>
    ${body}
    <div class="modal-actions" style="margin-top:18px;"><button class="btn secondary" onclick="closeModal()">Close</button></div>
  `);
}
/* Past tasks: completed ones are removed, unfinished ones roll over to today
   (keeping originalDate so the row can say how many days overdue it is). */
function rolloverTasks(){
  const t=todayStr(); let changed=false;
  DATA.tasks = DATA.tasks.filter(x=>{
    if(!x.date || x.date>=t) return true;
    if(x.completed || x.recurringId){ changed=true; return false; }
    x.originalDate = x.originalDate || x.date; x.date = t; changed=true;
    return true;
  });
  if(changed) saveData();
}

function mergeCloud(cloud){
  DATA = Object.assign(defaultData(), cloud);
  DATA.settings = Object.assign(defaultData().settings, cloud.settings||{});
  DATA.streaks = Object.assign(defaultData().streaks, cloud.streaks||{});

/* Runs once a user is logged in (or immediately if Firebase isn't configured). */
async function startSession(user){
  if(APP_STARTED) return;
  APP_STARTED = true;

  if(user){
    fbUser = user; fbUid = user.uid; fbReady = false;   // stays false until the cloud copy has been read
    LS_KEY = LEGACY_LS_KEY + '_' + user.uid;   // each account gets its own local cache
  }

  const hadLocal = !!localStorage.getItem(LS_KEY);
  loadData();                                   // instant local load

  if(user){
    const cloud = await fbLoad();
    if(cloud){
      mergeCloud(cloud);
      saveDataLocalOnly();
    } else if(cloud === null){
      // brand-new account: bring over data from before logins existed (first account on this device only)
      const legacy = !hadLocal ? localStorage.getItem(LEGACY_LS_KEY) : null;
      if(legacy){
        try{ mergeCloud(JSON.parse(legacy)); localStorage.removeItem(LEGACY_LS_KEY); }catch(e){}
      }
      if(pendingName) DATA.settings.studentName = pendingName;   // the name typed at signup is the one that stays
      saveDataLocalOnly();
      fbReady = true; fbSave();                 // create this user's cloud document
    }
    // cloud === undefined: read failed (offline) → keep local data for now
    fbReady = true;                             // from here on, every change syncs
  }

  hideAuthScreen();
  applyTheme();
  ensureRecurringTasksForToday();
  buildSidebar();
  buildBottomNav();
  updateTopDate();
  switchView('home');
  updateDeadlineFab();
  maybeShowDailyPopup();
  setInterval(()=>{ updateTopDate(); tickCountdowns(); checkDateRollover(); }, 30000);
  setInterval(()=>{ if(CURRENT_VIEW==='home') renderHomeCountdownOnly(); }, 1000);

  $('#fabBtn').addEventListener('click', openQuickAddMenu);
  $('#deadlineFabBtn').addEventListener('click', openDeadlinePanel);
  $('#moreMenuBtn').addEventListener('click', ()=>switchView('profile'));
  $('#tbGear').addEventListener('click', ()=>switchView('settings'));
  $('#tbBell').addEventListener('click', ()=>openDeadlinePanel());
  const sc=$('#streakCurrent'), sb=$('#streakBest');
  if(sc) sc.addEventListener('click', ()=>openStreakDetails('current'));
  if(sb) sb.addEventListener('click', ()=>openStreakDetails('best'));
}
function saveDataLocalOnly(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(DATA)); }catch(e){ console.error('Save failed', e); }
}

function boot(){
  try{
    const t = localStorage.getItem('jeeTrackerTheme');
    if(t) document.documentElement.setAttribute('data-theme', t);
  }catch(e){}
  initAuthUI();

  if(!FIREBASE_ENABLED || !initFirebase()){
    // no Firebase → old offline-only behaviour, no login
    startSession(null);
    return;
  }
  showAuthLoading('Loading…');
  fbAuth.onAuthStateChanged(user=>{
    if(user){
      showAuthLoading('Loading your data…');
      startSession(user);
    } else if(!APP_STARTED){
      showAuthScreen();
      setAuthMode('login');
    }
  });
}

function deadlineGroups(){
  const t=todayStr();

    .map(c=>({c, diff:Math.round((new Date(c.completeByDate)-new Date(t))/864e5)}))

    {key:'over', title:'Overdue', col:'#E5484D', items:pending.filter(x=>x.diff<0)},
    {key:'today', title:'Due today', col:'#F29A38', items:pending.filter(x=>x.diff===0)},

function roundRectPath(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function wrapCanvasText(ctx, text, x, y, maxWidth, lineHeight){
  const words = text.split(' ');
  let line = '';
  const lines = [];
  words.forEach(w=>{
    const test = line + w + ' ';
    if(ctx.measureText(test).width > maxWidth && line){
      lines.push(line.trim());
      line = w + ' ';
    } else line = test;
  });
  lines.push(line.trim());
  const startY = y - (lines.length-1)*lineHeight;
  lines.forEach((l,i)=>ctx.fillText(l, x, startY+i*lineHeight));
}
function drawShareCard(){
  const canvas = document.getElementById('shareCanvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const grad = ctx.createLinearGradient(0,0,0,H);
  grad.addColorStop(0, '#3E4FD9');
  grad.addColorStop(1, '#1F2A78');
  ctx.fillStyle = grad;
  ctx.fillRect(0,0,W,H);

  const dateLabel = new Date().toLocaleDateString('en-IN', {weekday:'long', year:'numeric', month:'long', day:'numeric'});
  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.75)';
  ctx.font = '600 30px system-ui, sans-serif';
  ctx.fillText(dateLabel, W/2, 110);

  ctx.fillStyle = '#fff';
  ctx.font = '800 56px system-ui, sans-serif';
  ctx.fillText("Today's Progress", W/2, 190);

  const hrs = studyHoursOn(todayStr());
  const q = questionsSolvedOn(todayStr());
  const tTasks = todaysTasks();
  const doneTasks = tTasks.filter(t=>t.completed).length;
  const streak = DATA.streaks.study.current;
  const testsToday = DATA.tests.filter(t=>t.date===todayStr());

  const stats = [
    {label:'Hours studied', value: hoursToHM(hrs)},
    {label:'Questions solved', value: String(q)},
    {label:'Tasks completed', value: `${doneTasks}/${tTasks.length}`},
    {label:'Current streak', value: `${streak} day${streak===1?'':'s'}`},
  ];
  if(testsToday.length){
    stats.push({label:'Mock test score', value: String(testsToday[testsToday.length-1].total)});
  }

  const startY = 280, cardH = 150, gap = 28, cardW = W-160;
  stats.forEach((st,i)=>{
    const y = startY + i*(cardH+gap);
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    roundRectPath(ctx, 80, y, cardW, cardH, 24);
    ctx.fill();
    ctx.textAlign = 'left';
    ctx.fillStyle = '#fff';
    ctx.font = '800 64px system-ui, sans-serif';
    ctx.fillText(st.value, 120, y+95);
    ctx.font = '500 28px system-ui, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.8)';
    ctx.fillText(st.label, 120, y+130);
  });

  ctx.textAlign = 'center';
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.font = 'italic 500 30px system-ui, sans-serif';
  wrapCanvasText(ctx, '"'+pickDailyQuote()+'"', W/2, H-90, W-160, 40);
}
function shareOrDownloadCard(){
  const canvas = document.getElementById('shareCanvas');
  canvas.toBlob(async (blob)=>{
    if(!blob) return;

function countdownParts(dateStr){
  const days = daysUntil(dateStr);
  return days;
}
function readinessScore(){
  const components = [];
  components.push({key:'syllabus', weight:35, value:overallSyllabusPct()});

  let activeDays=0;
  for(let i=0;i<14;i++){ if(studyHoursOn(addDays(todayStr(),-i))>0) activeDays++; }
  components.push({key:'consistency', weight:25, value:pct(activeDays,14)});

  const avgPct = recentPercentileAvg(5);
  if(avgPct!=null) components.push({key:'mocks', weight:25, value:Math.min(100,avgPct)});

  const plan = DATA.settings.goal ? buildDailyPlan() : null;
  if(plan && !plan.expired && plan.pace!=null && plan.perWeekNeeded>0){
    components.push({key:'pace', weight:15, value:Math.min(100, (plan.pace/plan.perWeekNeeded)*100)});
  }

  const totalWeight = components.reduce((s,c)=>s+c.weight,0);
  const score = totalWeight>0 ? Math.round(components.reduce((s,c)=>s+c.value*c.weight,0)/totalWeight) : 0;
  return {score, components};
}

      DATA.tasks.push({id:uid(), title:rt.title, subject:rt.subject, chapter:rt.chapter, date:t, startTime:rt.startTime, duration:rt.duration, priority:rt.priority, completed:false, recurringId:rt.id});
      changed = true;
    }
  });
  if(changed) saveData();
}

function saveTask(id){
  const title = $('#tf-title').value.trim();
  if(!title){ toast('Please enter a task title'); return; }
  const payload = {
    title,
    subject: $('#tf-subject').value,
    chapter: $('#tf-chapter').value,
    date: $('#tf-date').value || todayStr(),
    startTime: $('#tf-time').value,
    duration: Number($('#tf-duration').value)||0,
    priority: $('#tf-priority').value,
  };
  updateData(d=>{
    if(id){
      Object.assign(d.tasks.find(t=>t.id===id), payload);
    } else {
      const newTask = Object.assign({id:uid(), completed:false}, payload);
      const repeatEl = document.getElementById('tf-repeat');
      if(repeatEl && repeatEl.checked){
        const rt = {id:uid(), title:payload.title, subject:payload.subject, chapter:payload.chapter, startTime:payload.startTime, duration:payload.duration, priority:payload.priority, active:true};
        d.recurringTasks.push(rt);
        newTask.recurringId = rt.id;
      }
      d.tasks.push(newTask);
    }
  });
  closeModal();
  renderAll();
  toast(id?'Task updated':'Task added');
}

const KIND_TO_COLLECTION = {timeBlock:'timeBlocks', task:'tasks', chapter:'chapters', practice:'practiceSessions', test:'tests', revision:'revisions', studySession:'studySessions'};
function performDelete(kind, id){
  const collection = KIND_TO_COLLECTION[kind];
  const result = collection ? deleteData(collection, id) : null;
  closeModal();
  renderAll();
  if(result && result.item){
    toast('Deleted', {label:'Undo', onClick:()=>{
      updateData(d=>{ d[collection].splice(Math.min(result.idx, d[collection].length), 0, result.item); });
      renderAll();
      toast('Restored');
    }});
  } else {
    toast('Deleted');
  }
}

function scheduleRevisionsForChapter(chapterId){
  const exists = DATA.revisions.some(r=>r.chapterId===chapterId);
  if(exists) return;
  const gaps = (DATA.settings.revisionIntervals && DATA.settings.revisionIntervals.length) ? DATA.settings.revisionIntervals : [1,3,7,15];
  gaps.forEach((gap,i)=>{
    DATA.revisions.push({
      id: uid(), chapterId, round: i+1,
      dueDate: addDays(todayStr(), gap),
      completed:false, completedDate:null
    });
  });
}

function chapterPracticeStats(c){
  const sessions = DATA.practiceSessions.filter(p=>p.subject===c.subject && p.chapter===c.name);
  const attempted = sessions.reduce((s,p)=>s+Number(p.attempted||0),0);
  const correct = sessions.reduce((s,p)=>s+Number(p.correct||0),0);
  const wrong = sessions.reduce((s,p)=>s+Number(p.wrong||0),0);
  const accuracy = (correct+wrong) ? pct(correct, correct+wrong) : 0;
  return {attempted, correct, wrong, accuracy, sessionCount: sessions.length};
}
function chapterStudyMinutes(c){
  return allStudy().filter(s=>s.subject===c.subject && s.chapter===c.name).reduce((s,x)=>s+Number(x.minutes||0),0);
}
const WEIGHTAGE_COLORS = {
  High: 'color:var(--red); background:var(--red-tint);',
  Medium: 'color:var(--amber); background:var(--amber-tint);',
  Low: 'color:var(--green); background:var(--green-tint);',
};
function chapterLastStudiedDate(c){
  let last = null;
  allStudy().forEach(s=>{ if(s.subject===c.subject && s.chapter===c.name && (!last || s.date>last)) last = s.date; });
  DATA.practiceSessions.forEach(p=>{ if(p.subject===c.subject && p.chapter===c.name && (!last || p.date>last)) last = p.date; });
  return last;
}
function relativeDayLabel(dateStr){
  const diff = daysBetween(dateStr, todayStr());
  if(diff<=0) return 'today';
  if(diff===1) return 'yesterday';
  if(diff<=6) return diff+' days ago';
  return fmtDateShort(dateStr);
}
function chapterAvgTimePerQuestion(c){
  const sessions = DATA.practiceSessions.filter(p=>p.subject===c.subject && p.chapter===c.name && Number(p.timeMinutes)>0 && Number(p.attempted)>0);
  const totalSec = sessions.reduce((s,p)=>s+Number(p.timeMinutes)*60,0);
  const totalQ = sessions.reduce((s,p)=>s+Number(p.attempted),0);
  if(totalQ<=0) return null;
  return Math.round(totalSec/totalQ);
}
function chapterProgressPct(c){
  const done = [c.notesDone, c.questionsDone, c.pyqsDone, (c.status==='Completed'||c.status==='Revised')].filter(Boolean).length;
  return Math.round(done/4*100);
}
function chapterRowHtml(c){
  const pctV = chapterProgressPct(c);
  const isRev = c.status==='Revised', isDone = c.status==='Completed';

  const badge = isRev

    : isDone
      ? `<div class="ch-badge done" title="Completed"><svg ${SV}><path d="M5 12.5l4.5 4.5L19 7"/></svg></div>`
      : '';
  return `
  <div class="ch-tile-wrap" data-id="${c.id}">

    <div class="ch-tile ${c.important?'gold':''} ${pctV===100?'full':''}" style="--p:${pctV}" role="button" tabindex="0">
      <div class="ch-tile-in"><span>${esc(c.name)}</span></div>
    </div>
    <div class="ch-pct ${isRev?'rev':isDone?'done':''}">${pctV}%${isRev?' · Revised':isDone?' · Completed':''}</div>

function chapterDeadlineNote(c){
  if(!c.completeByDate || c.status==='Completed' || c.status==='Revised') return '';
  const t = todayStr();
  if(c.completeByDate < t) return `<span style="color:var(--red); font-size:12px; font-weight:700;">Overdue</span>`;
  const d = daysBetween(t, c.completeByDate);
  return `<span class="muted" style="font-size:12px;">${d===0?'Due today':d+'d left'}</span>`;
}
function bindChapterRowEvents(){
  $all('.ch-tile-wrap', view('chapters')).forEach(w=>{
    w.addEventListener('click', ()=>openChapterDetail(w.dataset.id));
  });
}
function setChapterField(id, field, val){
  let toastMsg = '';
  updateData(d=>{
    const ch = d.chapters.find(c=>c.id===id);
    if(!ch) return;
    ch[field] = val;
    let newStatus = (field==='status') ? val : null;

    // auto status from the Notes / Questions / PYQs ticks
    if(field==='notesDone' || field==='questionsDone' || field==='pyqsDone'){
      const all = !!(ch.notesDone && ch.questionsDone && ch.pyqsDone);
      const any = !!(ch.notesDone || ch.questionsDone || ch.pyqsDone);
      if(ch.status!=='Revised'){
        if(all) newStatus = 'Completed';
        else if(any && ch.status==='Not Started') newStatus = 'Studying';
        else if(!all && ch.status==='Completed') newStatus = 'Studying';
      }
      if(newStatus && newStatus!==ch.status) toastMsg = 'Status: ' + newStatus;
    }

    if(newStatus){
      ch.status = newStatus;
      if(newStatus==='Completed'||newStatus==='Revised'){
        if(!ch.completedOn) ch.completedOn = todayStr();   // used to measure your pace
        scheduleRevisionsForChapter(id);
      } else {
        ch.completedOn = null;
      }
    }
  });
  renderAll();
  openChapterDetail(id);
  if(field==='status') toast('Chapter status updated');
  else if(toastMsg) toast(toastMsg);
}

let PRACTICE_FILTER = { subject:'' };

function avgTimePerQuestion(subject){
  const sessions = DATA.practiceSessions.filter(p=>Number(p.timeMinutes)>0 && Number(p.attempted)>0 && (!subject || p.subject===subject));
  const totalSec = sessions.reduce((s,p)=>s+Number(p.timeMinutes)*60,0);
  const totalQ = sessions.reduce((s,p)=>s+Number(p.attempted),0);
  if(totalQ<=0) return null;
  return Math.round(totalSec/totalQ);
}
function formatSeconds(sec){
  if(sec==null) return '—';
  if(sec<60) return sec+'s';
  return Math.floor(sec/60)+'m '+(sec%60)+'s';
}

let TEST_FILTER = { type:'' };

function subjectAvgFromTests(field){
  const withVal = DATA.tests.filter(t=>t[field]!=null);
  if(!withVal.length) return null;
  return Math.round(withVal.reduce((s,t)=>s+Number(t[field]),0)/withVal.length*10)/10;
}
function sparklineSvg(values, color){
  if(values.length<2) return '';
  const w=300, h=90, pad=10;
  const max = Math.max(...values, 1), min = Math.min(...values, 0);
  const range = (max-min)||1;
  const stepX = (w-2*pad)/(values.length-1);
  const pts = values.map((v,i)=>{
    const x = pad + i*stepX;
    const y = h-pad - ((v-min)/range)*(h-2*pad);
    return {x,y};
  });
  const line = pts.map(p=>`${p.x},${p.y}`).join(' ');
  const dots = pts.map(p=>`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}"></circle>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%; height:90px; display:block;">
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2"/>
    ${dots}
  </svg>`;
}
function renderTests(){
  let tests = DATA.tests.slice().sort((a,b)=>b.date.localeCompare(a.date));

  const best = DATA.tests.length ? Math.max(...DATA.tests.map(t=>Number(t.total||0))) : 0;
  const rkTests = DATA.tests.filter(t=>t.percentile!=null && t.percentile!=='' && !isNaN(Number(t.percentile)));
  const avgPct = rkTests.length ? rkTests.reduce((a,t)=>a+Number(t.percentile),0)/rkTests.length : null;
  const avgRank = avgPct==null ? null : estRank(avgPct);
  const avgRankCard = avgPct==null ? '' : `<div class="card" style="margin-bottom:16px;display:flex;align-items:center;justify-content:space-between;gap:12px;"><div><div class="lbl muted">Average rank</div><div style="font:700 28px var(--font-head);">~${avgRank.toLocaleString('en-IN')}</div></div><div class="muted" style="text-align:right;font-size:12px;">Avg percentile ${avgPct.toFixed(2)}<br>out of 17,00,000 candidates<br>${rkTests.length} test${rkTests.length>1?'s':''}</div></div>`;
  const wkTests = DATA.tests.filter(t=>t.date>=addDays(todayStr(),-6)).length;
  const prevWkTests = DATA.tests.filter(t=>t.date>=addDays(todayStr(),-13)&&t.date<addDays(todayStr(),-6)).length;
  const withTotalQ = DATA.tests.filter(t=>t.totalQuestions);
  const avgAttemptRate = withTotalQ.length ? Math.round(withTotalQ.reduce((s,t)=>s+pct(t.questions||0, t.totalQuestions),0)/withTotalQ.length) : null;

  let improvement = '';
  if(DATA.tests.length>=2){
    const sorted = [...DATA.tests].sort((a,b)=>a.date.localeCompare(b.date));
    const prev = sorted[sorted.length-2], last = sorted[sorted.length-1];
    const diff = Number(last.total||0) - Number(prev.total||0);
    improvement = `<div class="card-flat" style="margin-bottom:16px;">
      <div class="lbl muted">Change vs previous test</div>
      <div style="font-size:18px; font-weight:700; color:${diff>=0?'var(--green)':'var(--red)'};">${diff>=0?'+':''}${diff} marks</div>
    </div>`;
  }

  const chronological = DATA.tests.slice().sort((a,b)=>a.date.localeCompare(b.date)).slice(-10);
  const scoreChart = chronological.length>=2 ? `

  const pctTests = chronological.filter(t=>t.percentile!=null);

  const subjAvgs = {Physics: subjectAvgFromTests('physics'), Chemistry: subjectAvgFromTests('chemistry'), Mathematics: subjectAvgFromTests('maths')};
  const subjEntries = Object.entries(subjAvgs).filter(([,v])=>v!==null);
  let weakest = null;
  if(subjEntries.length>=2){
    weakest = subjEntries.reduce((a,b)=>a[1]<=b[1]?a:b)[0];
  }
  const subjectAvgCard = subjEntries.length ? `

      ${subjEntries.map(([name,v])=>`<div class="hbar-row"><div class="hb-label">${name}</div><div class="hb-track"><div style="width:${Math.min(100,Math.max(0,pct(v,100)))}%; background:${name===weakest?'var(--red)':'var(--indigo)'};"></div></div><div class="hb-val">${v}</div></div>`).join('')}

    </div>` : '';

  const html = `

      <div class="stat"><div class="val">${DATA.tests.length}</div><div class="lbl">Tests taken</div></div>
      <div class="stat"><div class="val">${avgScore}</div><div class="lbl">Average score</div></div>
      <div class="stat"><div class="val">${avgAcc}%</div><div class="lbl">Average accuracy</div></div>
